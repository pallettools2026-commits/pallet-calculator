<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d392f">
<title>Страница не найдена — Pallet Tools</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#edf5f1,#f7faf8);color:#18231f;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.card{width:min(520px,100%);padding:32px;text-align:center;background:#fff;border:1px solid #dce7e1;border-radius:20px;box-shadow:0 10px 30px rgba(19,65,53,.08)}.code{font-size:64px;font-weight:800;line-height:1;color:#0d392f}.title{margin:14px 0 8px;font-size:24px}.text{margin:0 0 22px;color:#64736b;line-height:1.55}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 18px;border-radius:12px;background:#1f6f5c;color:#fff;text-decoration:none;font-weight:750;touch-action:manipulation}.btn:hover{background:#185c4c}.btn:focus-visible{outline:3px solid rgba(31,111,92,.25);outline-offset:3px}@media(max-width:480px){body{padding:16px}.card{padding:26px 18px;border-radius:16px}.code{font-size:54px}.title{font-size:22px}.btn{width:100%}}
</style>
</head>
<body>
<main class="card" aria-labelledby="not-found-title">
<div class="code" aria-hidden="true">404</div>
<h1 class="title" id="not-found-title">Страница не найдена</h1>
<p class="text">Возможно, ссылка устарела или адрес введён с ошибкой. Вернитесь в Pallet Tools и продолжите работу.</p>
<a class="btn" href="./">Вернуться в Pallet Tools</a>
</main>
</body>
</html>
