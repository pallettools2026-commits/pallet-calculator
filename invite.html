<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pallet Tools — создание пароля</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eef5ff 0%,#f7f9fb 45%,#fff4ef 100%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#191d2d}.card{width:min(100%,430px);background:rgba(255,255,255,.96);border:1px solid #dfe5eb;border-radius:24px;padding:32px;box-shadow:0 25px 60px rgba(24,35,52,.14)}.brand{text-align:center;margin-bottom:22px}.brand strong{display:block;font-size:22px;letter-spacing:.12em}.brand span{display:block;margin-top:4px;font-size:11px;letter-spacing:.3em;color:#9b6b42;font-weight:900}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.14em;color:#247357;text-align:center}.card h1{margin:7px 0 8px;font-size:27px;text-align:center}.lead{margin:0 0 22px;color:#747d8c;font-size:13px;line-height:1.5;text-align:center}.field{display:grid;gap:6px;margin-top:13px}.field label{font-size:10px;font-weight:900;letter-spacing:.08em;color:#747c8d}.field input{width:100%;min-height:50px;border:1px solid #dfe4eb;border-radius:11px;background:#fff;padding:12px 14px;font-size:16px;outline:none}.field input:focus{border-color:#7dac92;box-shadow:0 0 0 3px rgba(31,111,92,.1)}button{width:100%;min-height:52px;margin-top:18px;border:0;border-radius:11px;background:#176b4c;color:#fff;font-size:14px;font-weight:900;cursor:pointer;box-shadow:0 10px 20px rgba(23,107,76,.18)}button:disabled{opacity:.6;cursor:wait}.message{min-height:42px;margin-top:14px;padding:10px 12px;border-radius:10px;background:#f5f8f6;color:#5e6e66;font-size:12px;line-height:1.45;text-align:center}.message.error{background:#fff3f1;color:#a12622}.version{text-align:center;margin-top:14px;color:#a0a8b3;font-size:9px;letter-spacing:.06em}.hidden{display:none!important}@media(max-width:480px){body{padding:12px;align-items:start}.card{margin-top:5vh;padding:24px 18px;border-radius:18px}.brand{margin-bottom:18px}.brand strong{font-size:20px}.card h1{font-size:24px}.lead{margin-bottom:18px}.field input{min-height:52px}button{min-height:54px}}
</style>
</head>
<body>
<section class="card">
  <div class="brand"><strong>PALLET TOOLS</strong><span>СОТРУДНИК</span></div>
  <div class="eyebrow">ПРИГЛАШЕНИЕ ПРИНЯТО</div>
  <h1>Создайте пароль</h1>
  <p class="lead">Придумайте пароль для входа в Pallet Tools. Администратор ваш пароль не увидит.</p>
  <div id="form" class="hidden">
    <div class="field"><label for="password">НОВЫЙ ПАРОЛЬ</label><input id="password" type="password" minlength="6" autocomplete="new-password" placeholder="Минимум 6 символов"></div>
    <div class="field"><label for="password2">ПОВТОРИТЕ ПАРОЛЬ</label><input id="password2" type="password" minlength="6" autocomplete="new-password" placeholder="Повторите пароль"></div>
    <button id="savePassword" type="button">Сохранить пароль и войти</button>
  </div>
  <div id="message" class="message" role="status" aria-live="polite" aria-atomic="true">Проверяем ссылку приглашения…</div>
  <div class="version">Pallet Tools · v1.0.6</div>
</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://efhadobvfwvmyysivqpj.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_lnHl-ppTSs_B9qJI9rWEcw_0wZRqq62';
const MAIN_URL='https://pallettools2026-commits.github.io/pallet-calculator/';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const form=document.getElementById('form'),msg=document.getElementById('message'),p1=document.getElementById('password'),p2=document.getElementById('password2'),save=document.getElementById('savePassword');
function message(text,error=false){msg.textContent=text;msg.classList.toggle('error',error);}
async function ready(){
  const {data,error}=await sb.auth.getSession();
  if(error||!data?.session){message('Ссылка приглашения недействительна или уже истекла. Попросите администратора отправить новую ссылку.',true);return;}
  form.classList.remove('hidden');
  message('Введите новый пароль минимум из 6 символов.');
  p1.focus();
}
save.addEventListener('click',async()=>{
  const a=p1.value,b=p2.value;
  if(a.length<6){message('Пароль должен содержать минимум 6 символов.',true);p1.focus();return;}
  if(a!==b){message('Пароли не совпадают.',true);p2.focus();return;}
  save.disabled=true;message('Сохраняем пароль…');
  const {error}=await sb.auth.updateUser({password:a});
  if(error){save.disabled=false;message('Не удалось сохранить пароль: '+error.message,true);return;}
  message('Пароль сохранён. Открываем Pallet Tools…');
  setTimeout(()=>{location.replace(MAIN_URL);},700);
});
sb.auth.onAuthStateChange((event,session)=>{if(session&&(event==='SIGNED_IN'||event==='INITIAL_SESSION'))setTimeout(ready,0);});
setTimeout(ready,150);
</script>
</body>
</html>
