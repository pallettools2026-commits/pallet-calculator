name: Add employee registration profile

on:
  push:
    paths:
      - '.github/workflows/add-employee-registration-profile.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply employee registration profile patch
        run: python .github/scripts/add_employee_registration_profile.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add employee name and position registration"
          git push
