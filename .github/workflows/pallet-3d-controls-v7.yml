name: Refine pallet 3D controls
on:
  push:
    paths:
      - '.github/workflows/pallet-3d-controls-v7.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine 3D controls
        run: python .github/scripts/pallet_3d_controls_v7.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve pallet 3D controls" || exit 0
          git push
