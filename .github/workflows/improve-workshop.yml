name: Improve workshop tools

on:
  push:
    paths:
      - '.github/workflows/improve-workshop.yml'

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply workshop improvements
        run: python .github/scripts/improve_workshop.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add workshop cutting and lumber tools"
            git push
          fi
