name: Remove branded pallet v1.1.1

on:
  push:
    paths:
      - '.github/workflows/remove-branded-pallet-v111.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace branded pallet artwork
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          js_path = Path('assets/pallet3d-v10.js')
          css_path = Path('assets/theme-industrial-v130.css')

          index = index_path.read_text(encoding='utf-8')
          js = js_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')

          if 'assets/pallet-clean-3d-2.webp' not in index:
              raise SystemExit('Expected branded pallet image reference was not found in index.html')

          index = index.replace('assets/pallet-clean-3d-2.webp', 'assets/pallet-clean-3d-1.webp')
          index = index.replace('alt="Pallet Tools"', 'alt="Чистый деревянный поддон"')

          for name, text in [('index.html', index), ('assets/pallet3d-v10.js', js), ('assets/theme-industrial-v130.css', css)]:
              if 'v1.1.0' not in text:
                  raise SystemExit(f'Expected v1.1.0 marker was not found in {name}')

          index = index.replace('v1.1.0', 'v1.1.1')
          js = js.replace('v1.1.0', 'v1.1.1').replace('обновление №333', 'обновление №335')
          css = css.replace('v1.1.0', 'v1.1.1').replace('обновление №333', 'обновление №335')

          def bump_cache(text, pattern):
              changed = False
              def repl(match):
                  nonlocal changed
                  changed = True
                  return match.group(1) + str(int(match.group(2)) + 1)
              updated = re.sub(pattern, repl, text, count=1)
              if not changed:
                  raise SystemExit(f'Cache-buster not found: {pattern}')
              return updated

          index = bump_cache(index, r'(assets/pallet3d-v10\.js\?v=)(\d+)')
          index = bump_cache(index, r'(assets/theme-industrial-v130\.css\?v=)(\d+)')

          index_path.write_text(index, encoding='utf-8')
          js_path.write_text(js, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/pallet3d-v10.js assets/theme-industrial-v130.css
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Use clean unbranded pallet artwork'
          git push
