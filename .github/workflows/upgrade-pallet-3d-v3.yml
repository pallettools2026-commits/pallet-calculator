name: Upgrade pallet 3D workbench
on:
  push:
    paths:
      - '.github/workflows/upgrade-pallet-3d-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply 3D workbench
        run: python .github/scripts/upgrade_pallet_3d_v3.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add pallet 3D view modes" || exit 0
          git push
