name: Default second parts zero v136

on:
  push:
    paths:
      - '.github/workflows/default-second-parts-zero-v136.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply zero defaults
        run: python .github/scripts/default_second_parts_zero_v136.py
      - name: Commit zero defaults
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Set secondary pallet parts to zero by default"
          git pull --rebase origin main
          git push origin main
