name: Rebuild pallet 3D from reference
on:
  push:
    paths:
      - '.github/workflows/pallet-3d-reference-v90.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild realistic pallet 3D
        run: python .github/scripts/pallet_3d_reference_v90.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild realistic pallet 3D" || exit 0
          git push
