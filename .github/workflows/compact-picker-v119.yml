name: Compact pallet picker v119
on:
  push:
    paths:
      - '.github/workflows/compact-picker-v119.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make picker zones smaller
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('assets/theme-industrial-v130.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* pickerCompactV1119 */'
          patch = base64.b64decode('').decode('utf-8')
          if marker not in s:
              p.write_text(s + '\n\n' + patch, encoding='utf-8')
          PY
      - name: Commit compact picker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/theme-industrial-v130.css
          git commit -m "Make pallet picker zones smaller" || exit 0
          git push
