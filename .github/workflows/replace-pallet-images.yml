name: Replace pallet images

on:
  push:
    paths:
      - '.github/workflows/replace-pallet-images.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode clean pallet images
        shell: bash
        run: |
          python - <<'PY'
          import base64, re
          from pathlib import Path

          pairs = [
              ('assets/clean-pallet-hero.webp.b64.txt', 'assets/pallet-clean-3d-1.webp'),
              ('assets/clean-pallet-preview.webp.b64.txt', 'assets/pallet-clean-3d-2.webp'),
          ]
          for src, dst in pairs:
              raw = Path(src).read_text(encoding='utf-8')
              clean = re.sub(r'[^A-Za-z0-9+/=]', '', raw)
              clean += '=' * ((4 - len(clean) % 4) % 4)
              Path(dst).write_bytes(base64.b64decode(clean, validate=False))
          PY
          file assets/pallet-clean-3d-1.webp | grep -i webp
          file assets/pallet-clean-3d-2.webp | grep -i webp
          rm assets/clean-pallet-hero.webp.b64.txt assets/clean-pallet-preview.webp.b64.txt
      - name: Commit images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "Replace pallet images with clean light pallets"
          git push
