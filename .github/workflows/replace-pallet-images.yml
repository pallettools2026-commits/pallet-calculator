name: Replace pallet images

on:
  push:
    paths:
      - '.github/workflows/replace-pallet-images.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode clean pallet images
        shell: bash
        run: |
          base64 -d assets/clean-pallet-hero.webp.b64.txt > assets/pallet-clean-3d-1.webp
          base64 -d assets/clean-pallet-preview.webp.b64.txt > assets/pallet-clean-3d-2.webp
          rm assets/clean-pallet-hero.webp.b64.txt assets/clean-pallet-preview.webp.b64.txt
      - name: Commit images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "Replace pallet images with clean light pallets"
          git push
