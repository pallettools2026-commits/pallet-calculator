name: Run pallet pack modes v11

on:
  push:
    paths:
      - '.github/scripts/add-pallet-pack-v11.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch planner
        run: |
          python .github/scripts/add-pallet-pack-v11.py
          node --check assets/truck-planner-v9.js
      - name: Commit planner update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add truck-planner.html assets/truck-planner-v9.js
          git commit -m "Add 1-35 mama-papa and 1-20 pallet packs" || exit 0
          git push
