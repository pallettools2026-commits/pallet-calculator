name: Fix saw plan mobile
on:
  push:
    paths:
      - '.github/workflows/fix-saw-plan-mobile.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply saw plan responsive fix
        run: python .github/scripts/fix_saw_plan_mobile.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix saw plan overflow on small screens"
          git push
