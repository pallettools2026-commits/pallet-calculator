name: Add pallet visuals

on:
  push:
    paths:
      - '.github/workflows/add-pallet-visuals.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add clean 3D pallet visuals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          css = r'''
          .siteHero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(280px,.95fr);gap:24px;align-items:center;margin:0 0 16px;padding:28px;border:1px solid #d8e6df;border-radius:24px;background:linear-gradient(135deg,rgba(255,255,255,.98),rgba(237,247,242,.96));box-shadow:0 16px 40px rgba(19,65,53,.10);overflow:hidden;position:relative}
          .siteHero:before{content:"";position:absolute;width:280px;height:280px;border-radius:50%;right:-100px;top:-130px;background:rgba(55,143,115,.08);pointer-events:none}
          .siteHeroText{position:relative;z-index:1}
          .heroEyebrow{font-size:12px;font-weight:850;letter-spacing:.14em;color:#1f6f5c;margin-bottom:8px}
          .siteHero h1{margin:0 0 10px;font-size:38px;line-height:1.08;letter-spacing:-.7px;color:#102f28}
          .heroLead{margin:0;color:#5d6d65;font-size:16px;line-height:1.55;max-width:620px}
          .heroBenefits{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}
          .heroBenefits span{display:inline-flex;align-items:center;gap:6px;border:1px solid #d5e5de;background:rgba(255,255,255,.85);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:750;color:#31584c}
          .heroPalletFrame{display:flex;justify-content:center;align-items:center;min-height:230px;position:relative;z-index:1}
          .heroPalletFrame img{display:block;width:min(100%,340px);height:auto;object-fit:contain;filter:drop-shadow(0 18px 22px rgba(71,57,34,.18));transform:rotate(-1deg)}
          .palletShowcase{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:0 0 16px;padding:16px 20px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.94);box-shadow:var(--shadow)}
          .palletShowcaseText{min-width:0}
          .palletShowcaseText span{display:block;color:#1f6f5c;font-size:11px;font-weight:850;letter-spacing:.12em;margin-bottom:4px}
          .palletShowcaseText strong{display:block;color:#173c33;font-size:18px;margin-bottom:3px}
          .palletShowcaseText small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
          .palletShowcase img{display:block;width:220px;max-width:38vw;height:auto;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(71,57,34,.15))}
          @media(max-width:760px){.siteHero{grid-template-columns:1fr;padding:22px 18px;text-align:left}.siteHero h1{font-size:31px}.heroPalletFrame{min-height:170px}.heroPalletFrame img{width:min(100%,300px)}.palletShowcase{align-items:flex-start}.palletShowcase img{width:145px;max-width:42vw}}
          @media(max-width:480px){.siteHero h1{font-size:28px}.heroBenefits span{font-size:11px}.palletShowcase{flex-direction:column}.palletShowcase img{width:210px;max-width:100%;align-self:center}}
          @media print{.siteHero,.palletShowcase{display:none!important}}
          '''

          hero = r'''
          <section class="siteHero" aria-label="Pallet Tools">
            <div class="siteHeroText">
              <div class="heroEyebrow">PALLET TOOLS</div>
              <h1>Калькулятор деревянных поддонов</h1>
              <p class="heroLead">Быстрый расчёт материалов для производства поддонов — размеры, количество деталей, сохранение и печать.</p>
              <div class="heroBenefits"><span>✓ Точный расчёт</span><span>✓ Чистый интерфейс</span><span>✓ Телефон и компьютер</span></div>
            </div>
            <div class="heroPalletFrame"><img src="assets/pallet-clean-3d-1.webp" alt="Чистый деревянный поддон, 3D вид"></div>
          </section>
          <section class="palletShowcase" aria-label="3D вид поддона">
            <div class="palletShowcaseText"><span>3D ВИД</span><strong>Новый чистый деревянный поддон</strong><small>Визуальный пример конструкции. Изображение не влияет на расчёт.</small></div>
            <img src="assets/pallet-clean-3d-2.webp" alt="Новый деревянный поддон под углом">
          </section>
          '''

          if '.siteHero{' not in text:
              text = text.replace('</style>', css + '\n</style>', 1)

          if 'class="siteHero"' not in text:
              old = '<h1>Калькулятор поддонов</h1>'
              if old not in text:
                  raise SystemExit('Header marker not found')
              text = text.replace(old, hero, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add clean 3D pallet visuals"
            git push
          fi
