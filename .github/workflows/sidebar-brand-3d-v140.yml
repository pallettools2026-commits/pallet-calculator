name: Sidebar brand 3D v140
on:
  push:
    paths:
      - '.github/workflows/sidebar-brand-3d-v140.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore 3D sidebar brand
        run: python .github/scripts/restore_sidebar_3d_brand_v140.py
      - name: Commit 3D brand
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/ui-layout-v138.css
          git diff --cached --quiet && exit 0
          git commit -m "Restore 3D pallet sidebar brand"
          git push
