name: Manual pallet pack quantity v12

on:
  push:
    paths:
      - '.github/workflows/manual-pack-qty-v12.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply footprint patch
        run: python .github/scripts/fix_pack_footprints_v16.py
      - name: Validate JavaScript
        run: node --check assets/truck-planner-v9.js
      - name: Commit footprint rules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/truck-planner-v9.js truck-planner.html
          git commit -m "Fix pallet pack floor dimensions" || exit 0
          git push
