name: Dynamic pallet preview

on:
  push:
    paths:
      - '.github/workflows/dynamic-pallet-preview.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply dynamic pallet preview
        run: python .github/scripts/dynamic_pallet_preview.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make pallet preview follow dimensions"
          git push
