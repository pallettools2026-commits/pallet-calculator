name: Add employee profile panel

on:
  push:
    paths:
      - '.github/workflows/add-employee-profile-panel.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply employee profile panel patch
        run: python .github/scripts/add_employee_profile_panel.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add employee profile panel"
          git push
