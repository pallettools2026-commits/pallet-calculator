name: Refine pallet 3D bevels
on:
  push:
    paths:
      - '.github/workflows/pallet-3d-bevel-v83.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine pallet board and block edges
        run: python .github/scripts/pallet_3d_bevel_v83.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Round pallet board and block edges" || exit 0
          git push
