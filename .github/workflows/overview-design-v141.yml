name: Overview workspace polish v141

on:
  push:
    paths:
      - '.github/workflows/overview-design-v141.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable overview design
        run: python .github/scripts/enable_overview_v141.py
      - name: Commit overview design
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Polish overview workspace layout"
            git push
          fi
