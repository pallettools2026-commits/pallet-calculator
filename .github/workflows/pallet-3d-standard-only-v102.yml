name: Standard-only pallet 3D
on:
  push:
    paths:
      - '.github/workflows/pallet-3d-standard-only-v102.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restrict 3D to known standard pallet sizes
        run: python .github/scripts/pallet_3d_standard_only_v102.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pallet3d-v9.js
          git commit -m "Restrict pallet 3D to standard sizes" || exit 0
          git push
