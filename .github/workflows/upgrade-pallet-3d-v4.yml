name: Upgrade pallet 3D interaction
on:
  push:
    paths:
      - '.github/workflows/upgrade-pallet-3d-v4.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply interactive 3D upgrade
        run: python .github/scripts/upgrade_pallet_3d_v4.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add 360 drag and part highlighting to pallet 3D" || exit 0
          git push
