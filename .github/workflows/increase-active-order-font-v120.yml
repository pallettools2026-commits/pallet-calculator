name: Increase active order font v1.0.20

on:
  push:
    paths:
      - '.github/workflows/increase-active-order-font-v120.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase active order typography
        run: |
          sed -i 's@/\* Active order typography v1.0.19 \*/@/* Active order typography v1.0.20 */@' assets/theme-industrial-v130.css
          sed -i 's@\.currentOrderPanel \.dashPanelHead h3{font-size:16px!important}@.currentOrderPanel .dashPanelHead h3{font-size:18px!important;line-height:1.2!important}@' assets/theme-industrial-v130.css
          sed -i 's@\.currentOrderPanel \.dashPanelHead p{font-size:11px!important}@.currentOrderPanel .dashPanelHead p{font-size:13px!important;line-height:1.4!important}@' assets/theme-industrial-v130.css
          sed -i '/\.currentOrderPanel \.dashPanelHead p{/a .currentOrderPanel .dashPanelHead button{font-size:12px!important}' assets/theme-industrial-v130.css
          sed -i 's@\.currentOrderPanel \.orderBadges span{font-size:10px!important}@.currentOrderPanel .orderBadges span{font-size:12px!important;padding:5px 9px!important}@' assets/theme-industrial-v130.css
          sed -i 's@\.currentOrderPanel \.orderFocusMain h2{font-size:19px!important}@.currentOrderPanel .orderFocusMain h2{font-size:23px!important;line-height:1.15!important;margin-top:9px!important}@' assets/theme-industrial-v130.css
          sed -i 's@\.currentOrderPanel \.orderFocusMain p{font-size:11px!important}@.currentOrderPanel .orderFocusMain p{font-size:13px!important;line-height:1.4!important}@' assets/theme-industrial-v130.css
          sed -i 's@\.currentOrderPanel \.orderProgressTop{font-size:10px!important}@.currentOrderPanel .orderProgressTop{font-size:12px!important}@' assets/theme-industrial-v130.css
          sed -i 's@\.currentOrderPanel \.orderFocusAside small{font-size:9px!important}@.currentOrderPanel .orderFocusAside small{font-size:11px!important}@' assets/theme-industrial-v130.css
          sed -i 's@\.currentOrderPanel \.orderFocusAside b{font-size:12px!important}@.currentOrderPanel .orderFocusAside b{font-size:14px!important;line-height:1.3!important}@' assets/theme-industrial-v130.css
          sed -i 's/v1\.0\.19/v1.0.20/g; s/обновление №301/обновление №304/g' assets/theme-industrial-v130.css assets/pallet3d-v10.js
          sed -i 's/theme-industrial-v130.css?v=139/theme-industrial-v130.css?v=140/; s/pallet3d-v10.js?v=135/pallet3d-v10.js?v=136/' index.html
      - name: Remove one-shot workflow
        run: rm .github/workflows/increase-active-order-font-v120.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/theme-industrial-v130.css assets/pallet3d-v10.js index.html .github/workflows/increase-active-order-font-v120.yml
          git commit -m 'Enlarge active order typography'
          git push
