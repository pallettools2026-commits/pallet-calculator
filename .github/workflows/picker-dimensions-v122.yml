name: Picker dimensions v122
on:
  push:
    paths:
      - '.github/workflows/picker-dimensions-v122.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mm picker labels
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re
          js = Path('assets/pallet3d-v10.js')
          s = js.read_text(encoding='utf-8')
          old = "btn.innerHTML=`<span>${info.short||''}${Number(info.index||0)+1}</span>`;pickOverlay.appendChild(btn);return btn;"
          new = "const dimLabel=`${fmtMm(info.t)} × ${fmtMm(info.w)} × ${fmtMm(info.l)} мм`;btn.title=dimLabel;btn.innerHTML=`<span>${dimLabel}</span>`;pickOverlay.appendChild(btn);return btn;"
          if old not in s:
              raise SystemExit('picker label source not found')
          js.write_text(s.replace(old,new,1),encoding='utf-8')
          css = Path('assets/theme-industrial-v130.css')
          c = css.read_text(encoding='utf-8')
          marker = '/* pickerDimensionsV1122 */'
          patch = base64.b64decode('').decode('utf-8')
          if marker not in c:
              css.write_text(c+'\n\n'+patch,encoding='utf-8')
          idx = Path('index.html')
          h = idx.read_text(encoding='utf-8')
          h = re.sub(r'assets/theme-industrial-v130\.css\?v=\d+','assets/theme-industrial-v130.css?v=172',h)
          h = re.sub(r'assets/pallet3d-v10\.js\?v=\d+','assets/pallet3d-v10.js?v=122',h)
          idx.write_text(h,encoding='utf-8')
          PY
      - name: Commit mm labels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pallet3d-v10.js assets/theme-industrial-v130.css index.html
          git commit -m "Show pallet dimensions instead of blue picker" || exit 0
          git push
