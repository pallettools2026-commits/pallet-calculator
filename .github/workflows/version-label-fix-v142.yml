name: Sidebar version label fix v142

on:
  push:
    paths:
      - '.github/workflows/version-label-fix-v142.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable version label fix
        run: python .github/scripts/enable_version_label_fix_v142.py
      - name: Validate JavaScript
        run: node --check assets/version-label-fix-v142.js
      - name: Commit version label fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix duplicate sidebar version label"
            git push
          fi
