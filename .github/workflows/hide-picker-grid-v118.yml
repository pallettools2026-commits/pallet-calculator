name: Hide pallet picker grid v118
on:
  push:
    paths:
      - '.github/workflows/hide-picker-grid-v118.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide permanent picker grid
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('assets/theme-industrial-v130.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* pickerHoverOnlyV1118 */'
          patch = base64.b64decode('').decode('utf-8')
          if marker not in s:
              p.write_text(s + '\n\n' + patch, encoding='utf-8')
          PY
      - name: Commit picker display fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/theme-industrial-v130.css
          git commit -m "Hide permanent pallet picker grid" || exit 0
          git push
