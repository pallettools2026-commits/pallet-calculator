name: Improve saw plan readability v1.0.25

on:
  push:
    paths:
      - '.github/workflows/improve-saw-plan-v125.yml'

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply saw plan improvements
        run: python .github/scripts/improve_saw_plan_v125.py
      - name: Validate JavaScript
        run: node --check assets/pallet3d-v10.js
      - name: Commit saw plan improvements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve saw plan readability"
          git push
