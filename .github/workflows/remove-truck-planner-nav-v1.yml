name: Remove truck planner navigation

on:
  push:
    paths:
      - '.github/workflows/remove-truck-planner-nav-v1.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean main site navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          patterns = [
              r'<a[^>]*href=["\'][^"\']*truck-planner[^"\']*["\'][^>]*>.*?</a>',
              r'<button[^>]*data-screen=["\'][^"\']*truck[^"\']*["\'][^>]*>.*?</button>',
              r'<(?:a|button)[^>]*>[^<]*(?:Планировщик фуры|Планировщик загрузки фуры|Truck Planner)[^<]*</(?:a|button)>'
          ]
          for pat in patterns:
              s = re.sub(pat, '', s, flags=re.I|re.S)
          marker = '<!-- truck-planner-nav-removed-2026 -->'
          if marker not in s:
              s = s.replace('</body>', marker + '\n</body>')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Remove truck planner from left navigation"
            git push
          fi
