name: Remove truck planner navigation

on:
  push:
    paths:
      - '.github/workflows/remove-truck-planner-nav-v1.yml'

permissions:
  contents: write

jobs:
  remove-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove truck planner from main navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          nav='''<nav class="sideNav">\n    <button class="navLink appSideLink active" type="button" data-screen="overview"><span>⌂</span>Обзор</button>\n    <button class="navLink appSideLink" type="button" data-screen="production"><span>▥</span>Производство</button>\n    <button class="navLink appSideLink" type="button" data-screen="calculator"><span>▦</span>Калькулятор</button>\n    <button class="navLink appSideLink" type="button" data-screen="workshop"><span>⌁</span>Распил досок</button>\n    <button class="navLink appSideLink" type="button" data-screen="saved"><span>▤</span>Мои расчёты</button>\n    <button class="navLink appSideLink" id="profileSideBtn" type="button"><span>👤</span>Мой профиль</button>\n    <button class="navLink appSideLink adminSideLink" id="adminSideNav" type="button" data-screen="admin" hidden><span>⚙</span>Админ-панель</button>\n  </nav>'''
          s,n=re.subn(r'<nav class="sideNav">.*?</nav>',nav,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('sideNav block not found')
          marker='<!-- truckPlannerNavRemovedV1 -->'
          if marker not in s:
              cleanup='''<!-- truckPlannerNavRemovedV1 -->\n<script id="truckPlannerNavCleanupV1">\n(function(){function clean(){document.querySelectorAll('.appSidebar a,.appSidebar button,.mobileBottomNav a,.mobileBottomNav button,.mobileMoreSheet a,.mobileMoreSheet button').forEach(function(el){var h=(el.getAttribute('href')||'').toLowerCase(),d=(el.getAttribute('data-screen')||'').toLowerCase(),t=(el.textContent||'').toLowerCase().replace(/ё/g,'е');if(h.indexOf('truck-planner')!==-1||d.indexOf('truck')!==-1||t.indexOf('планировщик фур')!==-1||t.indexOf('планировщик загрузки')!==-1||t.indexOf('truck planner')!==-1)el.remove();});}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',clean,{once:true});else clean();setTimeout(clean,500);})();\n</script>'''
              s=s.replace('</body>',cleanup+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Remove truck planner from main sidebar"
            git push
          fi
