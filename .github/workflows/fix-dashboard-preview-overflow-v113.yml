name: Fix dashboard pallet preview overflow v1.0.13

on:
  push:
    paths:
      - '.github/workflows/fix-dashboard-preview-overflow-v113.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix pallet preview bounds
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('assets/pallet3d-v10.js')
          js = js_path.read_text(encoding='utf-8')

          old_scale = "const fitX=.72*width+.48*length,fitY=.26*width+.30*length,scale=Math.min(420/fitX,145/fitY),W=width*scale,L=length*scale,cx=270,baseY=205;"
          new_scale = "const fitX=.72*width+.48*length,fitY=.26*width+.30*length,scale=Math.min(380/fitX,132/fitY),W=width*scale,L=length*scale,cx=270,baseY=202;"
          if old_scale not in js:
              raise SystemExit('preview scale marker not found')
          js = js.replace(old_scale, new_scale, 1)

          stray = '<g opacity=".18" stroke="#88592f" stroke-width="1"><path d="M126 77 C220 112 320 91 417 126"/><path d="M108 110 C223 146 325 122 438 160"/></g>'
          if stray not in js:
              raise SystemExit('stray decorative lines marker not found')
          js = js.replace(stray, '', 1)

          js = js.replace("Pallet Tools · v1.0.12 · обновление №285", "Pallet Tools · v1.0.13 · обновление №287")
          js = js.replace("Pallet Tools · v1.0.12'", "Pallet Tools · v1.0.13'")
          js_path.write_text(js, encoding='utf-8')

          css_path = Path('assets/theme-industrial-v130.css')
          css = css_path.read_text(encoding='utf-8')
          css = css.replace('Pallet Tools · v1.0.12 · обновление №285','Pallet Tools · v1.0.13 · обновление №287')
          css = css.replace('Pallet Tools · v1.0.12','Pallet Tools · v1.0.13')
          css = css.replace('Dashboard live pallet preview v1.0.12','Dashboard live pallet preview v1.0.13')
          css_path.write_text(css, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          if 'assets/theme-industrial-v130.css?v=132' not in index:
              raise SystemExit('theme cache marker not found')
          if 'assets/pallet3d-v10.js?v=128' not in index:
              raise SystemExit('js cache marker not found')
          index = index.replace('assets/theme-industrial-v130.css?v=132','assets/theme-industrial-v130.css?v=133',1)
          index = index.replace('assets/pallet3d-v10.js?v=128','assets/pallet3d-v10.js?v=129',1)
          index_path.write_text(index, encoding='utf-8')

          workflow = Path('.github/workflows/fix-dashboard-preview-overflow-v113.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Validate JavaScript
        run: node --check assets/pallet3d-v10.js

      - name: Commit overflow fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix dashboard pallet preview overflow"
          git push
