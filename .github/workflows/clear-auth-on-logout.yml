name: Clear auth data on logout

on:
  push:
    paths:
      - '.github/workflows/clear-auth-on-logout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply logout cleanup patch
        run: python .github/scripts/clear_auth_on_logout.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Clear employee data after logout"
          git push
