name: Install pallet 3D v91
on:
  push:
    paths:
      - '.github/workflows/install-pallet3d-v91.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rebuilt 3D module
        run: python .github/scripts/install_pallet3d_v91.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/pallet3d-v9.js
          git commit -m "Install rebuilt pallet 3D v91" || exit 0
          git push
