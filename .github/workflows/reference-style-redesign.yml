name: Reference style redesign

on:
  push:
    paths:
      - '.github/workflows/reference-style-redesign.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reference-style redesign
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/redesign.py
          python /tmp/redesign.py
      - name: Commit redesign
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Redesign site to Pallet Tools reference style"
            git push
          fi
