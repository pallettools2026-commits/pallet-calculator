name: Mobile app shell v1.1.0

on:
  push:
    paths:
      - '.github/workflows/mobile-app-v110.yml'

permissions:
  contents: write

jobs:
  improve-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build mobile app shell
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')

          mobile_markup = r'''
<!-- mobileAppShellV110 -->
<nav class="mobileBottomNav" aria-label="Мобильная навигация">
  <button class="mobileNavBtn appSideLink active" type="button" data-screen="overview"><span>⌂</span><small>Главная</small></button>
  <button class="mobileNavBtn appSideLink" type="button" data-screen="calculator"><span>▦</span><small>Расчёт</small></button>
  <button class="mobileNavBtn appSideLink" type="button" data-screen="workshop"><span>⌁</span><small>Распил</small></button>
  <button class="mobileNavBtn appSideLink" type="button" data-screen="saved"><span>▤</span><small>История</small></button>
  <button class="mobileNavBtn" id="mobileMoreBtn" type="button" aria-haspopup="dialog" aria-expanded="false"><span>•••</span><small>Ещё</small></button>
</nav>
<div class="mobileMoreSheet" id="mobileMoreSheet" hidden>
  <button class="mobileMoreBackdrop" type="button" data-mobile-more-close aria-label="Закрыть меню"></button>
  <section class="mobileMorePanel" role="dialog" aria-modal="true" aria-labelledby="mobileMoreTitle">
    <div class="mobileMoreHandle"></div>
    <div class="mobileMoreHead"><div><small>PALLET TOOLS</small><h2 id="mobileMoreTitle">Ещё</h2></div><button type="button" data-mobile-more-close aria-label="Закрыть">×</button></div>
    <div class="mobileMoreActions">
      <button class="mobileMoreAction appSideLink" type="button" data-screen="production"><span>▥</span><b>Производство</b><i>›</i></button>
      <button class="mobileMoreAction" id="mobileProfileBtn" type="button"><span>👤</span><b>Мой профиль</b><i>›</i></button>
      <button class="mobileMoreAction appSideLink adminSideLink" id="mobileAdminNav" type="button" data-screen="admin" hidden><span>⚙</span><b>Админ-панель</b><i>›</i></button>
    </div>
    <div class="mobileMoreVersion">Pallet Tools · v1.1.0</div>
  </section>
</div>
'''
          anchor = '</aside>\n\n<section class="productionDashboardV3" id="productionDashboard" data-app-screen="overview">'
          if 'mobileAppShellV110' not in index:
              if anchor not in index:
                  raise SystemExit('mobile nav anchor not found')
              index = index.replace(anchor, '</aside>\n' + mobile_markup + '\n<section class="productionDashboardV3" id="productionDashboard" data-app-screen="overview">', 1)

          mobile_script = r'''
<script>
/* mobileAppShellV110 */
(function(){
  const moreBtn=document.getElementById('mobileMoreBtn'),sheet=document.getElementById('mobileMoreSheet');
  if(!moreBtn||!sheet)return;
  const close=()=>{sheet.hidden=true;moreBtn.setAttribute('aria-expanded','false');document.body.classList.remove('mobileSheetOpen');};
  const open=()=>{sheet.hidden=false;moreBtn.setAttribute('aria-expanded','true');document.body.classList.add('mobileSheetOpen');};
  moreBtn.addEventListener('click',()=>sheet.hidden?open():close());
  sheet.querySelectorAll('[data-mobile-more-close]').forEach(btn=>btn.addEventListener('click',close));
  document.getElementById('mobileProfileBtn')?.addEventListener('click',()=>{close();document.getElementById('profileSideBtn')?.click();});
  document.querySelectorAll('.mobileBottomNav .appSideLink[data-screen]').forEach(btn=>btn.addEventListener('click',()=>{close();moreBtn.classList.remove('active');}));
  sheet.querySelectorAll('.mobileMoreAction.appSideLink[data-screen]').forEach(btn=>btn.addEventListener('click',()=>{close();moreBtn.classList.add('active');}));
  const syncMore=()=>{const active=[...sheet.querySelectorAll('.mobileMoreAction.appSideLink[data-screen]')].some(btn=>btn.classList.contains('active'));moreBtn.classList.toggle('active',active);};
  const observer=new MutationObserver(syncMore);sheet.querySelectorAll('.mobileMoreAction.appSideLink[data-screen]').forEach(btn=>observer.observe(btn,{attributes:true,attributeFilter:['class']}));
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheet.hidden)close();});
})();
</script>
'''
          script_anchor = '<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>'
          if '/* mobileAppShellV110 */' not in index:
              if script_anchor not in index:
                  raise SystemExit('mobile script anchor not found')
              index = index.replace(script_anchor, mobile_script + '\n' + script_anchor, 1)

          index = index.replace('assets/theme-industrial-v130.css?v=147','assets/theme-industrial-v130.css?v=148',1)
          index = index.replace('assets/pallet3d-v10.js?v=143','assets/pallet3d-v10.js?v=144',1)
          index_path.write_text(index, encoding='utf-8')

          theme_path = Path('assets/theme-industrial-v130.css')
          theme = theme_path.read_text(encoding='utf-8')
          mobile_css = r'''

/* Mobile app shell v1.1.0 */
.mobileBottomNav,.mobileMoreSheet{display:none}
.mobileMoreSheet[hidden]{display:none!important}
@media(max-width:760px){
  body{background:#f4f3ef!important}
  body.mobileSheetOpen{overflow:hidden}
  main{padding:10px 10px 22px!important;max-width:none!important}
  .topNav{position:sticky!important;top:0!important;z-index:70!important;min-height:60px!important;margin:0 -10px 8px!important;padding:8px 10px!important;border-bottom:1px solid #e4e0d9!important;background:rgba(250,249,246,.96)!important;backdrop-filter:blur(14px);box-shadow:0 4px 18px rgba(35,40,43,.06)!important}
  .brandLockup{gap:8px!important;min-width:0}.brandLockup img{width:42px!important;height:36px!important;object-fit:contain!important}.brandTitle{font-size:18px!important;line-height:1!important}.brandSub{display:none!important}
  .topAccount{min-width:44px!important;width:44px!important;height:44px!important;padding:0!important;border-radius:13px!important;justify-content:center!important}.topAccount .accountMain,.topAccount .accountArrow{display:none!important}.accountShield{margin:0!important}
  .accountDropdown{position:fixed!important;left:10px!important;right:10px!important;top:66px!important;width:auto!important;max-width:none!important}
  #protectedApp{margin-left:0!important;padding-bottom:92px!important}
  .appSidebar{display:none!important}
  .mobileBottomNav{position:fixed!important;z-index:95!important;left:8px!important;right:8px!important;bottom:8px!important;display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:3px!important;min-height:68px!important;padding:6px 6px calc(6px + env(safe-area-inset-bottom))!important;border:1px solid rgba(218,213,205,.9)!important;border-radius:19px!important;background:rgba(255,255,255,.94)!important;backdrop-filter:blur(18px);box-shadow:0 12px 38px rgba(31,35,37,.18)!important}
  .mobileBottomNav .mobileNavBtn{display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:2px!important;min-width:0!important;min-height:54px!important;width:100%!important;padding:5px 2px!important;border:0!important;border-radius:13px!important;background:transparent!important;color:#7a7f80!important;box-shadow:none!important;font-size:0!important;font-weight:850!important;text-align:center!important;white-space:normal!important}
  .mobileBottomNav .mobileNavBtn span{display:grid!important;place-items:center!important;width:28px!important;height:25px!important;margin:0!important;font-size:19px!important;line-height:1!important}
  .mobileBottomNav .mobileNavBtn small{display:block!important;font-size:9px!important;line-height:1!important;font-weight:850!important;color:inherit!important}
  .mobileBottomNav .mobileNavBtn.active{background:#f4e8da!important;color:#9a622f!important;box-shadow:none!important}
  .mobileBottomNav #mobileMoreBtn.active{background:#f4e8da!important;color:#9a622f!important}
  .mobileMoreSheet:not([hidden]){position:fixed!important;z-index:110!important;inset:0!important;display:block!important}
  .mobileMoreBackdrop{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;border:0!important;background:rgba(28,31,32,.34)!important;backdrop-filter:blur(2px)}
  .mobileMorePanel{position:absolute!important;left:8px!important;right:8px!important;bottom:84px!important;padding:8px 14px 14px!important;border:1px solid #ded8cf!important;border-radius:22px!important;background:#fff!important;box-shadow:0 22px 60px rgba(28,31,32,.26)!important;animation:mobileSheetIn .18s ease-out}
  @keyframes mobileSheetIn{from{transform:translateY(18px);opacity:.4}to{transform:none;opacity:1}}
  .mobileMoreHandle{width:38px;height:4px;margin:1px auto 10px;border-radius:999px;background:#d8d4cd}
  .mobileMoreHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}.mobileMoreHead small{display:block;color:#a16836;font-size:9px;font-weight:900;letter-spacing:.12em}.mobileMoreHead h2{margin:2px 0 0!important;font-size:22px!important}.mobileMoreHead>button{width:38px;height:38px;border:0;border-radius:11px;background:#f4f2ee;color:#5f6668;font-size:23px}
  .mobileMoreActions{display:grid;gap:7px}.mobileMoreAction{display:grid!important;grid-template-columns:38px minmax(0,1fr) auto!important;align-items:center!important;gap:10px!important;width:100%!important;min-height:52px!important;padding:7px 10px!important;border:1px solid #e7e2da!important;border-radius:14px!important;background:#faf9f6!important;color:#3e4548!important;text-align:left!important;box-shadow:none!important}.mobileMoreAction span{display:grid!important;place-items:center!important;width:34px!important;height:34px!important;border-radius:10px!important;background:#f1e5d7!important;color:#95612f!important;font-size:18px!important}.mobileMoreAction b{font-size:13px!important}.mobileMoreAction i{font-style:normal!important;color:#a3a5a3!important;font-size:20px!important}.mobileMoreAction.active{border-color:#d9c3a8!important;background:#f8efe5!important;color:#7d542f!important;box-shadow:none!important}.mobileMoreVersion{margin-top:10px;color:#a1a4a2;font-size:9px;text-align:center}
  .productionDashboardV3{display:flex!important;flex-direction:column!important;margin:8px 0 10px!important}.productionDashboardV3 .dashIntro{order:1!important}.productionDashboardV3 .dashLayout{order:2!important}.productionDashboardV3 .dashKpis{order:3!important}
  .dashIntro{gap:10px!important;margin-bottom:10px!important}.dashEyebrow{font-size:9px!important}.dashIntro h1{font-size:25px!important;letter-spacing:-.4px!important}.dashIntro p{display:none!important}.dashIntroActions{width:100%!important}.dashIntroActions button{min-height:46px!important;border-radius:13px!important;font-size:12px!important}.dashIntroActions button.secondary{display:none!important}
  .dashLayout{display:block!important}.dashMainCol,.dashSideCol{display:grid!important;grid-template-columns:1fr!important;gap:10px!important}.dashSideCol{margin-top:10px!important}.dashPanel{padding:13px!important;border-radius:18px!important}.dashPanelHead{margin-bottom:10px!important}.dashPanelHead p{display:none!important}.dashPanelHead button{min-height:38px!important;border-radius:10px!important}
  .currentOrderPanel{order:-5!important;padding:12px!important}.currentOrderPanel .dashPanelHead h3{font-size:16px!important}.orderFocus{display:grid!important;grid-template-columns:1fr!important;gap:10px!important;padding:10px!important;border-radius:16px!important}.orderFocus>img.dashDynamicPallet,.orderFocus>img{display:block!important;width:100%!important;max-width:290px!important;height:142px!important;margin:0 auto!important;object-fit:contain!important}.orderFocusMain h2{font-size:23px!important}.orderFocusMain p{font-size:11px!important}.orderBadges span{font-size:10px!important}.orderProgressTop{font-size:10px!important}.dashBar{height:9px!important}.orderFocusAside{display:grid!important;grid-template-columns:1fr 1fr!important;gap:4px 10px!important;border-left:0!important;border-top:1px solid #e8e4dd!important;padding:10px 0 0!important}.orderFocusAside small{font-size:8px!important}.orderFocusAside b{font-size:11px!important;margin:0 0 4px!important}.orderReadiness{grid-template-columns:auto minmax(0,1fr)!important;padding:11px!important}.orderReadinessAction{grid-column:1/-1!important;width:100%!important}
  .dashKpis{display:flex!important;grid-template-columns:none!important;gap:9px!important;margin:10px -2px 0!important;padding:2px 2px 5px!important;overflow-x:auto!important;scroll-snap-type:x mandatory!important;scrollbar-width:none}.dashKpis::-webkit-scrollbar{display:none}.dashKpi{flex:0 0 min(78vw,270px)!important;scroll-snap-align:start!important;min-height:78px!important;padding:12px!important;border-radius:16px!important}.dashKpiIcon{width:40px!important;height:40px!important}.dashKpi strong{font-size:18px!important}
  .dashMiniGrid{grid-template-columns:1fr!important;gap:10px!important}.dashPanel.compact{min-height:0!important}.shiftMini{gap:6px!important}.shiftMini div{padding:8px!important}.shiftMini b{font-size:18px!important}
  .palletViewPanel{display:none!important}.quickGrid{grid-template-columns:1fr 1fr!important}.quickGrid button{min-height:64px!important;border-radius:13px!important;font-size:10px!important}
  .dashboardCards{grid-template-columns:1fr!important;gap:10px!important}.calculatorCard,.previewCard{padding:13px!important;border-radius:18px!important}.calculatorCard .grid3{grid-template-columns:1fr!important;gap:9px!important}.calculatorCard input{min-height:48px!important;font-size:17px!important}.calculateJump{width:100%!important;min-height:50px!important;border-radius:13px!important}.previewHead{align-items:flex-start!important;gap:8px!important}.previewHead .sizeBadge{font-size:10px!important}.dynamicPalletStage,.previewStage{width:100%!important;max-width:100%!important;overflow:hidden!important}.palletReferenceHost{max-width:100%!important;overflow:hidden!important}.palletReferenceHost canvas{display:block!important;max-width:100%!important}.previewActions{display:grid!important;grid-template-columns:1fr 1fr!important}.previewActions button:last-child{grid-column:1/-1!important}
  .materialsHeader{margin-top:12px!important}.parts{gap:10px!important}
  .workshopTitle,.productionHead{align-items:flex-start!important;flex-direction:column!important;gap:10px!important}.workshopTitle>button,.productionHead .prodActions{width:100%!important}.shopKpis{grid-template-columns:1fr 1fr!important;gap:8px!important}.shopKpi{padding:11px!important}.shopGrid,.prodGrid{grid-template-columns:1fr!important;gap:10px!important}.shopCard,.prodCard{padding:13px!important;border-radius:18px!important}.shopInputs,.shopInputs.four,.prodInputs,.prodInputs.three{grid-template-columns:1fr!important;gap:8px!important}.shopInline{grid-template-columns:1fr!important}.shopInline button,.shopPrimary,.shopGhost{width:100%!important}.sawSummary{grid-template-columns:1fr 1fr!important;gap:7px!important}.routeStrip{overflow-x:auto!important;justify-content:flex-start!important;padding-bottom:4px!important}.routeStep{min-width:116px!important}.stockBar{overflow:hidden!important}
  .savedBox{border-radius:18px!important}.savedItem{border-radius:14px!important}.savedRows{grid-template-columns:1fr!important}
}
@media(max-width:390px){
  .mobileBottomNav{left:5px!important;right:5px!important;bottom:5px!important}.mobileBottomNav .mobileNavBtn small{font-size:8px!important}.dashKpi{flex-basis:84vw!important}.shopKpis,.sawSummary{grid-template-columns:1fr!important}.quickGrid{grid-template-columns:1fr!important}
}
'''
          if '/* Mobile app shell v1.1.0 */' not in theme:
              theme += mobile_css
          theme = theme.replace('Pallet Tools · v1.0.26 · обновление №329','Pallet Tools · v1.1.0 · обновление №331')
          theme = theme.replace('Pallet Tools · v1.0.26','Pallet Tools · v1.1.0')
          theme_path.write_text(theme, encoding='utf-8')

          js_path = Path('assets/pallet3d-v10.js')
          js = js_path.read_text(encoding='utf-8')
          js = js.replace('Pallet Tools · v1.0.26 · обновление №329','Pallet Tools · v1.1.0 · обновление №331')
          js = js.replace("Pallet Tools · v1.0.26'","Pallet Tools · v1.1.0'")
          js_path.write_text(js, encoding='utf-8')

          workflow = Path('.github/workflows/mobile-app-v110.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Validate mobile shell
        shell: bash
        run: |
          grep -q 'mobileAppShellV110' index.html
          grep -q 'Mobile app shell v1.1.0' assets/theme-industrial-v130.css
          grep -q 'v1.1.0' assets/pallet3d-v10.js
          node --check assets/pallet3d-v10.js

      - name: Commit mobile experience
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Create dedicated mobile app experience"
          git push
