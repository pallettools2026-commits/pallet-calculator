name: Mobile app shell v1.1.0

on:
  push:
    paths:
      - '.github/workflows/mobile-app-v110.yml'

permissions:
  contents: write

jobs:
  improve-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build mobile app shell
        run: python scripts/apply_mobile_v110.py

      - name: Validate mobile shell
        shell: bash
        run: |
          grep -q 'mobileAppShellV110' index.html
          grep -q 'Mobile app shell v1.1.0' assets/theme-industrial-v130.css
          grep -q 'v1.1.0' assets/pallet3d-v10.js
          node --check assets/pallet3d-v10.js

      - name: Commit mobile experience
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Create dedicated mobile app experience"
          git push
