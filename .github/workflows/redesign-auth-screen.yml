name: Redesign auth screen

on:
  push:
    paths:
      - '.github/workflows/redesign-auth-screen.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply auth redesign
        run: python .github/scripts/redesign_auth_screen.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Redesign login and registration screen"
          git push
