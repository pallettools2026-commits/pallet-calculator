name: Production workspace polish v149

on:
  push:
    paths:
      - '.github/workflows/production-design-v149.yml'
      - '.github/scripts/enable_production_v149.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable production design
        run: python .github/scripts/enable_production_v149.py
      - name: Commit production design
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Polish production workspace layout"
            git push
          fi
