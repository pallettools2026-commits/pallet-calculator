name: Split Truck Planner Site

on:
  push:
    paths:
      - '.github/workflows/split-truck-site-v1.yml'

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create standalone truck site
        run: python .github/scripts/split_truck_site_v1.py
      - name: Validate standalone JavaScript
        run: node --check truck-site/assets/truck-planner-v10.js
      - name: Verify main site no longer exposes old truck page
        run: test ! -f truck-planner.html
      - name: Commit split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move truck planner to standalone site" || exit 0
          git push
