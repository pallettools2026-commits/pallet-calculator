name: Pallet selected part weight v129
on:
  push:
    paths:
      - '.github/workflows/part-weight-v129.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add selected part weights
        run: python .github/scripts/part-weight-v129.py
      - name: Commit selected part weights
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pallet3d-v10.js assets/smart-tools-v1.js assets/theme-industrial-v130.css index.html
          git commit -m "Add selected pallet part weights" || exit 0
          git push
