name: Picker dimensions priority v123
on:
  push:
    paths:
      - '.github/workflows/picker-dimensions-priority-v123.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strengthen mm label styles
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re
          css = Path('assets/theme-industrial-v130.css')
          c = css.read_text(encoding='utf-8')
          marker = '/* pickerDimensionsPriorityV1123 */'
          patch = base64.b64decode('').decode('utf-8')
          if marker not in c:
              css.write_text(c+'\n\n'+patch,encoding='utf-8')
          idx = Path('index.html')
          h = idx.read_text(encoding='utf-8')
          h = re.sub(r'assets/theme-industrial-v130\.css\?v=\d+','assets/theme-industrial-v130.css?v=173',h)
          idx.write_text(h,encoding='utf-8')
          PY
      - name: Commit priority styles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/theme-industrial-v130.css index.html
          git commit -m "Prioritize pallet mm labels" || exit 0
          git push
