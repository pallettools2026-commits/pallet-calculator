name: Enable PWA cache bust v1

on:
  push:
    paths:
      - '.github/workflows/enable-pwa-cache-bust-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh PWA bootstrap script URL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'assets/version-label-fix-v142.js?v=150'
          new = 'assets/version-label-fix-v142.js?v=151'
          if new in s:
              raise SystemExit(0)
          if old not in s:
              raise SystemExit('Expected script URL not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit cache bust
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Enable PWA bootstrap cache refresh'
          git push
