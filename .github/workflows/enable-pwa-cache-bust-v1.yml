name: Enable PWA cache bust v2

on:
  push:
    paths:
      - '.github/workflows/enable-pwa-cache-bust-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh PWA asset URLs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          replace_once('index.html',
                       'assets/version-label-fix-v142.js?v=151',
                       'assets/version-label-fix-v142.js?v=152')
          replace_once('assets/version-label-fix-v142.js',
                       "script.src='assets/pwa-v1.js?v=1'",
                       "script.src='assets/pwa-v1.js?v=2'")
          PY
      - name: Commit PWA cache refresh
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/version-label-fix-v142.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh PWA install assets'
          git push
