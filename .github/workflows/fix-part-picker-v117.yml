name: Fix pallet part picker v117
on:
  push:
    paths:
      - '.github/workflows/fix-part-picker-v117.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix pallet part picker
        run: python .github/scripts/fix_part_picker_v117.py
      - name: Commit picker fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pallet3d-v10.js
          git commit -m "Fix pallet part selection outside 3D view" || exit 0
          git push
