name: Pallet material v135

on:
  push:
    paths:
      - '.github/workflows/pallet-material-v135.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply pallet material estimate
        run: python .github/scripts/add_pallet_material_v135.py
      - name: Validate JavaScript
        run: node --check assets/pallet3d-v10.js
      - name: Commit pallet material estimate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pallet3d-v10.js assets/theme-industrial-v130.css index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add pallet material volume estimate"
          git pull --rebase origin main
          git push origin main
