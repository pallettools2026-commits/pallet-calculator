name: Pallet dimensions toggle v125
on:
  push:
    paths:
      - '.github/workflows/picker-dims-toggle-v125.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply dimensions toggle
        run: |
          echo '' | base64 -d > /tmp/pallet_patch.py
          python /tmp/pallet_patch.py
      - name: Commit dimensions toggle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pallet3d-v10.js assets/theme-industrial-v130.css index.html
          git commit -m "Add pallet dimensions toggle" || exit 0
          git push
