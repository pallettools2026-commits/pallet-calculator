name: Apply global search fix

on: [push]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply search fix
        run: python3 .github/fix-global-search-v121.py
      - name: Remove temporary files
        run: rm .github/workflows/fix-global-search-v121.yml .github/fix-global-search-v121.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/theme-industrial-v130.css assets/pallet3d-v10.js .github/workflows/fix-global-search-v121.yml .github/fix-global-search-v121.py
          git commit -m 'Fix global search and email autofill'
          git push
