name: Version label v148

on:
  push:
    paths:
      - '.github/workflows/version-label-v148.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bump version label cache
        run: python .github/scripts/bump_version_label_v148.py
      - name: Commit cache bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh version label cache v148"
            git push origin main
          fi
