name: Bump Pallet 3D v120
on:
  push:
    paths:
      - '.github/workflows/bump-pallet3d-v120.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump Pallet 3D cache version
        run: python .github/scripts/bump_pallet3d_v120.py
      - name: Commit index update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use Pallet 3D v120" || exit 0
          git push
