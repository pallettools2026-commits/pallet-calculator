name: Fix dashboard pallet preview large v1.0.16

on:
  push:
    paths:
      - '.github/workflows/fix-dashboard-preview-large-v116.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enlarge dashboard pallet preview
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_required(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} marker not found')
              return text.replace(old, new, 1)

          js_path = Path('assets/pallet3d-v10.js')
          js = js_path.read_text(encoding='utf-8')
          start = js.find('  function setupDashboardPalletPreview(){')
          end = js.find('  function updateSiteVersion()', start)
          if start < 0 or end < 0:
              raise SystemExit('dashboard preview markers not found')
          seg = js[start:end]
          seg = replace_required(seg,
              'const fitX=.72*width+.48*length,fitY=.26*width+.30*length,scale=Math.min(300/fitX,96/fitY),W=width*scale,L=length*scale,cx=270,baseY=183;',
              'const fitX=.76*width+.42*length,fitY=.15*width+.20*length,scale=Math.min(430/fitX,150/fitY),W=width*scale,L=length*scale,cx=270,baseY=171;',
              'preview scale')
          seg = replace_required(seg,
              'const p=(x,z,y=0)=>[cx+x*.72-z*.48,baseY+x*.26+z*.30-y];',
              'const p=(x,z,y=0)=>[cx+x*.76-z*.42,baseY+x*.15+z*.20-y];',
              'preview projection')
          seg = seg.replace('const runnerCenters=[-W*.32,0,W*.32]', 'const runnerCenters=[-W*.34,0,W*.34]', 1)
          seg = seg.replace('prism(x-runnerW/2,-L*.42,x+runnerW/2,L*.42', 'prism(x-runnerW/2,-L*.47,x+runnerW/2,L*.47', 1)
          seg = seg.replace('[-L*.31,0,L*.31]', '[-L*.32,0,L*.32]', 2)
          seg = seg.replace('prism(-W*.44,z-crossDepth/2,W*.44,z+crossDepth/2', 'prism(-W*.47,z-crossDepth/2,W*.47,z+crossDepth/2', 1)
          seg = seg.replace('Math.min(W*.13,W*.82/deckCount)', 'Math.min(W*.13,W*.84/deckCount)', 1)
          seg = seg.replace('x=-W*.44+deckW/2+i*(W*.88-deckW)/(deckCount-1)', 'x=-W*.47+deckW/2+i*(W*.94-deckW)/(deckCount-1)', 1)
          seg = seg.replace('prism(x-deckW/2,-L*.44,x+deckW/2,L*.44', 'prism(x-deckW/2,-L*.47,x+deckW/2,L*.47', 1)
          seg = seg.replace('const shadowRx=Math.min(130,(W*.72+L*.48)*.40);', 'const shadowRx=Math.min(190,(W*.76+L*.42)*.43);', 1)
          js = js[:start] + seg + js[end:]
          js = js.replace('Pallet Tools · v1.0.15 · обновление №292', 'Pallet Tools · v1.0.16 · обновление №295')
          js = js.replace("Pallet Tools · v1.0.15'", "Pallet Tools · v1.0.16'")
          js_path.write_text(js, encoding='utf-8')

          css_path = Path('assets/theme-industrial-v130.css')
          css = css_path.read_text(encoding='utf-8')
          css = css.replace('Pallet Tools · v1.0.15 · обновление №292', 'Pallet Tools · v1.0.16 · обновление №295')
          css = css.replace('Pallet Tools · v1.0.15', 'Pallet Tools · v1.0.16')
          css = css.replace('Dashboard live pallet preview v1.0.15', 'Dashboard live pallet preview v1.0.16')
          css = replace_required(css,
              'width:min(80%,350px)!important;height:180px!important;object-fit:contain!important;padding:12px!important',
              'width:min(96%,430px)!important;height:214px!important;object-fit:contain!important;padding:0!important',
              'preview css')
          css = css.replace('height:162px!important', 'height:190px!important')
          css = css.replace('height:142px!important', 'height:166px!important')
          css_path.write_text(css, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = replace_required(index, 'assets/theme-industrial-v130.css?v=135', 'assets/theme-industrial-v130.css?v=136', 'theme cache')
          index = replace_required(index, 'assets/pallet3d-v10.js?v=131', 'assets/pallet3d-v10.js?v=132', 'js cache')
          index_path.write_text(index, encoding='utf-8')

          workflow = Path('.github/workflows/fix-dashboard-preview-large-v116.yml')
          if workflow.exists():
              workflow.unlink()
          PY
      - name: Validate JavaScript
        run: node --check assets/pallet3d-v10.js
      - name: Commit large preview
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enlarge dashboard pallet preview"
          git push
