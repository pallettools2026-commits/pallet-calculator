name: Fix dashboard pallet preview large v1.0.16

on:
  push:
    paths:
      - '.github/workflows/fix-dashboard-preview-large-v116.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make dashboard pallet large and contained
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          js_path = Path('assets/pallet3d-v10.js')
          js = js_path.read_text(encoding='utf-8')
          start = js.find('  function setupDashboardPalletPreview(){')
          end = js.find('  function updateSiteVersion()', start)
          if start < 0 or end < 0:
              raise SystemExit('dashboard preview function markers not found')

          replacement = r'''  function setupDashboardPalletPreview(){
    const orderImg=document.querySelector('.orderFocus>img'),viewImg=document.querySelector('.dashPalletImage img');
    if(!orderImg&&!viewImg)return;
    let lastSignature='';
    const pts=a=>a.map(v=>`${v[0].toFixed(1)},${v[1].toFixed(1)}`).join(' ');
    const makeSvg=(length,width,deckCount)=>{
      length=Math.max(300,num(length,1200));width=Math.max(300,num(width,800));deckCount=clamp(Math.round(num(deckCount,7)),3,12);
      const fitX=.76*width+.42*length,fitY=.15*width+.20*length,scale=Math.min(430/fitX,150/fitY),W=width*scale,L=length*scale,cx=270,baseY=174;
      const p=(x,z,y=0)=>[cx+x*.76-z*.42,baseY+x*.15+z*.20-y];
      const prism=(x0,z0,x1,z1,y,h,top,front,side)=>{const A=p(x0,z0,y+h),B=p(x1,z0,y+h),C=p(x1,z1,y+h),D=p(x0,z1,y+h),B0=p(x1,z0,y),C0=p(x1,z1,y),D0=p(x0,z1,y);return `<polygon points="${pts([D,C,C0,D0])}" fill="${front}"/><polygon points="${pts([B,C,C0,B0])}" fill="${side}"/><polygon points="${pts([A,B,C,D])}" fill="${top}" stroke="#8d623b" stroke-opacity=".25" stroke-width=".8"/>`;};
      let shape='';
      const runnerCenters=[-W*.34,0,W*.34],runnerW=Math.max(11,W*.12),runnerH=11;
      runnerCenters.forEach(x=>shape+=prism(x-runnerW/2,-L*.47,x+runnerW/2,L*.47,0,runnerH,'url(#runnerTop)','#b6783f','#925b31'));
      const blockW=Math.max(15,W*.16),blockL=Math.max(15,L*.11),blockH=28;
      runnerCenters.forEach(x=>[-L*.32,0,L*.32].forEach(z=>shape+=prism(x-blockW/2,z-blockL/2,x+blockW/2,z+blockL/2,runnerH,blockH,'url(#blockTop)','#c4874d','#9d6337')));
      const crossH=9,crossDepth=Math.max(9,L*.055);
      [-L*.32,0,L*.32].forEach(z=>shape+=prism(-W*.47,z-crossDepth/2,W*.47,z+crossDepth/2,runnerH+blockH,crossH,'url(#crossTop)','#d7a46d','#af7744'));
      const deckH=9,deckW=Math.max(8,Math.min(W*.13,W*.84/deckCount));
      for(let i=0;i<deckCount;i++){const x=-W*.47+deckW/2+i*(W*.94-deckW)/(deckCount-1);shape+=prism(x-deckW/2,-L*.47,x+deckW/2,L*.47,runnerH+blockH+crossH,deckH,'url(#deckTop)','#e1b77f','#bd8952');}
      const shadowRx=Math.min(190,(W*.76+L*.42)*.43);
      const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" role="img" aria-label="Поддон ${Math.round(length)} на ${Math.round(width)} миллиметров"><defs><linearGradient id="deckTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6d7aa"/><stop offset=".52" stop-color="#e8bd83"/><stop offset="1" stop-color="#d9a86d"/></linearGradient><linearGradient id="crossTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#efc994"/><stop offset="1" stop-color="#dca66b"/></linearGradient><linearGradient id="blockTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e4b57b"/><stop offset="1" stop-color="#c98d52"/></linearGradient><linearGradient id="runnerTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dca86d"/><stop offset="1" stop-color="#bd7d43"/></linearGradient><clipPath id="safe"><rect x="18" y="14" width="504" height="232" rx="18"/></clipPath><filter id="soft"><feGaussianBlur stdDeviation="7"/></filter></defs><rect x="18" y="14" width="504" height="232" rx="18" fill="#fbfaf7"/><g clip-path="url(#safe)"><ellipse cx="270" cy="224" rx="${shadowRx.toFixed(1)}" ry="19" fill="#66513b" opacity=".14" filter="url(#soft)"/>${shape}</g></svg>`;
      return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg);
    };
    const refresh=()=>{const length=num(el('pL')?.value,1200),width=num(el('pW')?.value,800),deckCount=num(el('n0')?.value,7),signature=`${length}|${width}|${deckCount}`;if(signature===lastSignature)return;lastSignature=signature;const src=makeSvg(length,width,deckCount);[orderImg,viewImg].forEach(img=>{if(!img)return;img.src=src;img.alt=`Поддон ${Math.round(length)} × ${Math.round(width)} мм`;img.classList.add('dashDynamicPallet');});};
    ['pL','pW','n0'].forEach(id=>{const input=el(id);if(!input||input.dataset.dashboardPreviewReady==='1')return;input.dataset.dashboardPreviewReady='1';input.addEventListener('input',refresh);input.addEventListener('change',refresh);});
    refresh();setInterval(refresh,1500);
  }

'''
          js = js[:start] + replacement + js[end:]
          js = js.replace("Pallet Tools · v1.0.15 · обновление №292", "Pallet Tools · v1.0.16 · обновление №294")
          js = js.replace("Pallet Tools · v1.0.15'", "Pallet Tools · v1.0.16'")
          js_path.write_text(js, encoding='utf-8')

          css_path = Path('assets/theme-industrial-v130.css')
          css = css_path.read_text(encoding='utf-8')
          css = css.replace('Pallet Tools · v1.0.15 · обновление №292','Pallet Tools · v1.0.16 · обновление №294')
          css = css.replace('Pallet Tools · v1.0.15','Pallet Tools · v1.0.16')
          css = css.replace('Dashboard live pallet preview v1.0.15','Dashboard live pallet preview v1.0.16')
          css = css.replace('width:min(80%,350px)!important;height:180px!important;object-fit:contain!important;padding:12px!important','width:min(96%,430px)!important;height:214px!important;object-fit:contain!important;padding:0!important')
          css = css.replace('height:162px!important','height:190px!important').replace('height:142px!important','height:166px!important')
          css_path.write_text(css, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          if 'assets/theme-industrial-v130.css?v=135' not in index:
              raise SystemExit('theme cache marker not found')
          if 'assets/pallet3d-v10.js?v=131' not in index:
              raise SystemExit('js cache marker not found')
          index = index.replace('assets/theme-industrial-v130.css?v=135','assets/theme-industrial-v130.css?v=136',1)
          index = index.replace('assets/pallet3d-v10.js?v=131','assets/pallet3d-v10.js?v=132',1)
          index_path.write_text(index, encoding='utf-8')

          workflow = Path('.github/workflows/fix-dashboard-preview-large-v116.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Validate JavaScript
        run: node --check assets/pallet3d-v10.js

      - name: Commit large preview
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enlarge dashboard pallet preview"
          git push
