name: Group identical saw patterns v1.0.26

on:
  push:
    paths:
      - '.github/workflows/group-saw-patterns-v126.yml'

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Group identical cutting patterns
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')

          pattern = re.compile(r'function renderStockBar\(bin,stock,usable,trim,index\)\{.*?\n\}\nfunction runSawOptimizer', re.S)
          replacement = r'''function renderStockBar(bin,stock,usable,trim,index,repeat=1){
  const off=Math.max(0,bin.remaining),usableWidth=Math.max(1,usable),groups=[];
  bin.items.forEach(item=>{const last=groups[groups.length-1];if(last&&Math.abs(last.len-item.len)<.01)last.count++;else groups.push({len:item.len,count:1});});
  const used=bin.items.reduce((sum,item)=>sum+item.len,0);
  const pieces=groups.map(g=>{const total=g.len*g.count,pct=Math.max(1,(total/usableWidth)*100),label=g.count>1?`${g.count} × ${Math.round(g.len)} мм`:`${Math.round(g.len)} мм`;return `<span class="stockPiece stockPieceGroup" style="width:${pct}%" title="${label}">${label}</span>`;}).join("");
  const offPct=Math.max(0,(off/usableWidth)*100),boardLabel=repeat>1?`Доски ${index+1}–${index+repeat}`:`Доска ${index+1}`,repeatBadge=repeat>1?`<em class="stockRepeat">одинаково ×${repeat}</em>`:"";
  return `<div class="stockBar"><div class="stockPieces">${pieces}</div>${offPct>0.3?`<span class="stockOffcut" style="width:${offPct}%" title="Остаток ${formatNumber(off,0)} мм"></span>`:""}</div><div class="stockMeta"><span><b>${boardLabel}</b>${repeatBadge} · ${bin.items.length} дет. · ${formatNumber(used,0)} мм деталей</span><span class="stockRemain">остаток <b>${formatNumber(off,0)} мм</b></span></div>`;
}
function groupSawBins(bins){
  const map=new Map();
  bins.forEach((bin,index)=>{const signature=bin.items.map(x=>Math.round(x.len*10)/10).join(',')+'|'+Math.round(bin.remaining*10)/10;let group=map.get(signature);if(!group){group={bin,count:0,first:index,last:index};map.set(signature,group);}group.count++;group.last=index;});
  return [...map.values()];
}
function runSawOptimizer'''
          index, count = pattern.subn(replacement, index, count=1)
          if count != 1:
              raise SystemExit('renderStockBar marker not found')

          old_preview = 'const preview=res.bins.slice(0,12).map((b,i)=>renderStockBar(b,stock,res.usable,trim,i)).join("");'
          new_preview = 'const patterns=groupSawBins(res.bins),preview=patterns.slice(0,8).map(g=>renderStockBar(g.bin,stock,res.usable,trim,g.first,g.count)).join("");'
          if old_preview not in index:
              raise SystemExit('preview marker not found')
          index = index.replace(old_preview, new_preview, 1)

          old_header = '${res.bins.length} досок сырья${res.overs.length?'
          new_header = '${res.bins.length} досок сырья · схем раскроя: ${patterns.length}${res.overs.length?'
          if old_header not in index:
              raise SystemExit('group header marker not found')
          index = index.replace(old_header, new_header, 1)

          old_more = '${preview}${res.bins.length>12?`<div class="moreBoards">Показаны первые 12 из ${res.bins.length} досок.</div>`:""}'
          new_more = '${preview}${patterns.length>8?`<div class="moreBoards">Показаны первые 8 из ${patterns.length} схем раскроя.</div>`:""}'
          if old_more not in index:
              raise SystemExit('more boards marker not found')
          index = index.replace(old_more, new_more, 1)

          old_legend = 'const sawLegend=\'<div class="sawLegend"><span><i class="sawLegendPiece"></i>Коричневое — детали</span><span><i class="sawLegendOffcut"></i>Светлое — остаток</span><span><b>38 × 150 мм</b> = 38 деталей по 150 мм</span></div>\';'
          new_legend = 'const sawLegend=\'<div class="sawLegend"><span><i class="sawLegendPiece"></i>Коричневое — детали</span><span><i class="sawLegendOffcut"></i>Светлое — остаток</span><span><b>38 × 150 мм</b> = 38 деталей по 150 мм</span><span class="sawLegendHint">Одинаковые схемы объединяются</span></div>\';'
          if old_legend not in index:
              raise SystemExit('legend marker not found')
          index = index.replace(old_legend, new_legend, 1)

          old_note = '<div class="shopNote">Каждая строка — одна доска сырья. Например, «38 × 150 мм» означает 38 деталей длиной 150 мм из этой доски. Светлая зона справа — остаток. Расчёт учитывает ширину пропила и торцовку.</div>'
          new_note = '<div class="shopNote">Одинаковые доски теперь объединяются в одну схему. Например, «Доски 1–16 · одинаково ×16» означает: одну и ту же схему распила повторить 16 раз. «38 × 150 мм» — 38 деталей по 150 мм из каждой такой доски. Светлая зона справа — остаток.</div>'
          if old_note not in index:
              raise SystemExit('saw note marker not found')
          index = index.replace(old_note, new_note, 1)

          css_override = r'''

/* sawPatternGroupingV3 */
.stockMeta>span:first-child{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.stockRepeat{display:inline-flex;align-items:center;min-height:22px;padding:3px 8px;border-radius:999px;background:#f4e7d8;color:#87572e;font-size:10px;font-style:normal;font-weight:900;letter-spacing:.02em;white-space:nowrap}
.sawLegendHint{padding:4px 8px;border-radius:999px;background:#f5efe7;color:#795b3c;font-weight:800}
.sawGroupTitle span{font-weight:700}
.moreBoards{padding:8px 10px;border-radius:9px;background:#f5f4f0;color:#646b6d!important}
@media(max-width:560px){.stockMeta>span:first-child{align-items:flex-start}.stockRepeat{font-size:9px;min-height:20px;padding:2px 6px}.sawLegendHint{width:100%;justify-content:center}.sawGroupTitle span{width:100%}}
'''
          if '/* sawPatternGroupingV3 */' not in index:
              index = index.replace('</style>', css_override + '\n</style>', 1)

          index = index.replace('assets/theme-industrial-v130.css?v=146','assets/theme-industrial-v130.css?v=147',1)
          index = index.replace('assets/pallet3d-v10.js?v=142','assets/pallet3d-v10.js?v=143',1)
          index_path.write_text(index, encoding='utf-8')

          js_path = Path('assets/pallet3d-v10.js')
          js = js_path.read_text(encoding='utf-8')
          js = js.replace('Pallet Tools · v1.0.25 · обновление №325','Pallet Tools · v1.0.26 · обновление №328')
          js = js.replace("Pallet Tools · v1.0.25'","Pallet Tools · v1.0.26'")
          js_path.write_text(js, encoding='utf-8')

          theme_path = Path('assets/theme-industrial-v130.css')
          theme = theme_path.read_text(encoding='utf-8')
          theme = theme.replace('Pallet Tools · v1.0.25 · обновление №325','Pallet Tools · v1.0.26 · обновление №328')
          theme = theme.replace('Pallet Tools · v1.0.25','Pallet Tools · v1.0.26')
          theme_path.write_text(theme, encoding='utf-8')

          workflow = Path('.github/workflows/group-saw-patterns-v126.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Validate JavaScript asset
        run: node --check assets/pallet3d-v10.js

      - name: Verify grouped saw markers
        shell: bash
        run: |
          grep -q 'function groupSawBins' index.html
          grep -q 'sawPatternGroupingV3' index.html
          grep -q 'v1.0.26' assets/pallet3d-v10.js

      - name: Commit grouped saw patterns
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Group identical saw cutting patterns"
          git push
