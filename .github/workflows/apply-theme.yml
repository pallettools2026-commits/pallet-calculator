name: Apply calculator theme

on:
  push:
    paths:
      - '.github/workflows/apply-theme.yml'

permissions:
  contents: write

jobs:
  apply-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update calculator styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          css = base64.b64decode('')
          css = css.decode('utf-8')
          new = re.sub(r'<style>.*?</style>', '<style>\n' + css + '\n</style>', text, count=1, flags=re.S)
          if new == text:
              raise SystemExit('Style block was not changed')
          p.write_text(new, encoding='utf-8')
          PY
      - name: Commit theme
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh calculator visual theme"
          git push
