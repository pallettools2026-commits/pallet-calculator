name: Apply calculator theme

on:
  push:
    paths:
      - '.github/workflows/apply-theme.yml'

permissions:
  contents: write

jobs:
  apply-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update calculator styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          css = r'''*{box-sizing:border-box}
:root{
  --bg:#f2f6f4;
  --surface:#ffffff;
  --surface-soft:#f7faf8;
  --text:#18231f;
  --muted:#64736b;
  --line:#dce7e1;
  --primary:#1f6f5c;
  --primary-dark:#124c40;
  --primary-deep:#0d392f;
  --accent:#dff1e9;
  --warning-bg:#fff5df;
  --warning-text:#835f18;
  --danger:#a33a32;
  --shadow:0 10px 30px rgba(19,65,53,.08);
}
html{background:var(--bg)}
body{margin:0;background:linear-gradient(180deg,#edf5f1 0,#f7faf8 320px,#f3f6f4 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh}
main{max-width:1080px;margin:auto;padding:28px 24px 44px}
h1{margin:0 0 22px;font-size:34px;line-height:1.15;letter-spacing:-.5px;color:var(--primary-deep)}
h2{margin:0 0 14px;font-size:21px;color:#183d34}
.card,.authCard,.savedBox{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.card{padding:19px;margin-bottom:14px}
.jobCard{border-left:4px solid #7ab39f}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:160px 1fr 1fr 1.35fr;gap:12px}
label{display:block;font-size:13px;font-weight:750;margin-bottom:6px;color:#375047}
input{width:100%;min-width:0;min-height:48px;padding:10px 12px;border:1px solid #cbd9d2;border-radius:11px;font-size:18px;background:#fff;color:var(--text);transition:border-color .18s,box-shadow .18s,background .18s}
input:hover{border-color:#a9c1b6}
input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(31,111,92,.13);background:#fff}
.parts{display:grid;grid-template-columns:1fr;gap:14px}
.result{background:linear-gradient(145deg,var(--primary-deep),#155746);color:#fff;border-radius:22px;padding:22px;margin-top:18px;box-shadow:0 16px 38px rgba(13,57,47,.20)}
.resultHead{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:10px}
.resultHead small{opacity:.72;text-transform:uppercase;letter-spacing:.08em;font-size:11px}
.resultHead strong{font-size:26px}
.row{padding:13px 0;border-bottom:1px solid rgba(255,255,255,.14)}
.row:last-child{border:0}
.top{display:flex;justify-content:space-between;gap:12px;font-size:18px}
.top b{font-size:21px;white-space:nowrap;color:#e8fff4}
.dim{opacity:.74;margin-top:4px;font-size:14px}
.lengthWrap{display:grid;grid-template-columns:minmax(120px,1fr) auto;gap:8px;align-items:stretch}
.lengthWrap input{min-width:0;width:100%}
.autoBtn{min-width:78px;border:1px solid #b9d1c7;border-radius:10px;padding:0 11px;background:#e8f4ef;color:#185444;font-weight:750;cursor:pointer;transition:.18s}
.autoBtn:hover{background:#dceee6;border-color:#86ad9d}
.autoBtn.manual{background:var(--warning-bg);color:var(--warning-text);border-color:#ead39e}
.autoHint{font-size:11px;color:#708078;margin-top:5px}
.authStatus{font-size:13px;color:var(--muted);margin:-8px 0 14px}.authStatus b{color:var(--primary-dark)}
.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.saveBtn,.printAllBtn,.clearBtn,.printBtn,.authBtn{border:0;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:750;cursor:pointer;transition:transform .15s,box-shadow .15s,filter .15s}
.saveBtn,.authBtn.secondary{background:var(--primary);color:#fff;box-shadow:0 7px 18px rgba(31,111,92,.18)}
.printBtn{background:#2f7f70;color:#fff;box-shadow:0 7px 18px rgba(47,127,112,.16)}
.printAllBtn,.authBtn{background:var(--primary-deep);color:#fff;box-shadow:0 7px 18px rgba(13,57,47,.18)}
.clearBtn,.authBtn.logout{background:#e9efec;color:#33473f;border:1px solid #d8e2dd}
.saveBtn:hover,.printBtn:hover,.printAllBtn:hover,.authBtn:hover{filter:brightness(1.05);transform:translateY(-1px)}
.clearBtn:hover,.authBtn.logout:hover{background:#e1e9e5;transform:translateY(-1px)}
.savedBox{padding:18px;margin-top:20px;color:var(--text);box-shadow:none;border-color:rgba(255,255,255,.3)}
.savedBox h2{margin:0 0 12px}
.savedEmpty{color:var(--muted);font-size:14px}
.savedItem{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;background:var(--surface-soft)}
.savedHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:8px}
.savedTitle{font-size:18px;font-weight:750;color:#173c33}
.savedMeta{font-size:13px;color:var(--muted);margin-top:3px}
.savedRows{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.savedRow{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed #d6e2dc;padding:6px 0}
.savedRow b{white-space:nowrap;color:#174d40}
.deleteSaved{border:1px solid #d4ded9;background:#fff;color:#5d3330;border-radius:10px;padding:7px 10px;cursor:pointer}
.deleteSaved:hover{background:#fff6f5;border-color:#e1c3bf}
.authCard{padding:20px;margin-bottom:16px;border-top:4px solid var(--primary);box-shadow:0 12px 36px rgba(20,71,58,.10)}
.authTop{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.authFields{display:grid;grid-template-columns:1fr 1fr auto auto;gap:10px;align-items:end;margin-top:14px}
.authBtn{min-height:48px}
.authMessage{font-size:13px;color:#5e6e66;margin-top:10px;line-height:1.45}.authUser{font-weight:750;color:var(--primary-dark)}
.appLocked{display:none!important}
@media(max-width:900px){.grid4{grid-template-columns:1fr 1fr}}
@media(max-width:760px){
  main{padding:18px 14px 34px}
  .parts{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr}
  .grid4{grid-template-columns:1fr 1fr}
  .authFields{grid-template-columns:1fr}
  .authBtn{width:100%}
  h1{font-size:28px}
  .actions{justify-content:stretch}
  .actions button{flex:1 1 44%}
}
@media(max-width:620px){.savedRows{grid-template-columns:1fr}}
@media(max-width:430px){
  .grid4{grid-template-columns:1fr}
  .lengthWrap{grid-template-columns:minmax(0,1fr) 82px}
  .actions button{flex:1 1 100%}
  .result{padding:18px;border-radius:18px}
  .resultHead{align-items:flex-start;flex-direction:column}
}
@media print{
  body{background:#fff;color:#000}
  main{max-width:none;padding:0}
  h1{font-size:24px;margin-bottom:14px;color:#000}
  .actions,.card{display:none !important}
  .jobCard{display:none !important}
  .printMeta{display:block !important;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #bbb;font-size:14px;color:#000}
  .autoBtn,.autoHint,.deleteSaved,.clearBtn,.saveBtn,.printAllBtn,.printBtn{display:none !important}
  .savedBox{border:0;padding:0;margin-top:18px;box-shadow:none}
  .savedItem{break-inside:avoid;background:#fff;border:1px solid #bbb}
  .savedRows{grid-template-columns:1fr 1fr}
  .result{background:#fff;color:#000;border:1px solid #bbb;border-radius:0;padding:16px;margin:0;box-shadow:none}
  .resultHead small,.dim{opacity:1;color:#333}
  .row{border-bottom:1px solid #ccc;break-inside:avoid}
  .top b{color:#000}
  .authCard{display:none!important}
}'''
          new = re.sub(r'<style>.*?</style>', '<style>\n' + css + '\n</style>', text, count=1, flags=re.S)
          if new == text:
              raise SystemExit('Style block was not changed')
          p.write_text(new, encoding='utf-8')
          PY
      - name: Commit theme
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh calculator visual theme"
          git push
