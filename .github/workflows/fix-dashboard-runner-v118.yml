name: Fix dashboard runner v1.0.18

on:
  push:
    paths:
      - '.github/workflows/fix-dashboard-runner-v118.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Shorten dashboard runners further
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('assets/pallet3d-v10.js')
          js = js_path.read_text(encoding='utf-8')
          old = "runnerCenters.forEach(x=>shape+=prism(x-runnerW/2,-L*.43,x+runnerW/2,L*.43,0,runnerH,'url(#runnerTop)','#b6783f','#925b31'));"
          new = "runnerCenters.forEach(x=>shape+=prism(x-runnerW/2,-L*.37,x+runnerW/2,L*.37,0,runnerH,'url(#runnerTop)','#b6783f','#925b31'));"
          if old not in js:
              raise SystemExit('runner geometry marker not found')
          js = js.replace(old, new, 1)
          js = re.sub(r"Pallet Tools · v1\.0\.17 · обновление №297", "Pallet Tools · v1.0.18 · обновление №299", js)
          js = re.sub(r"Pallet Tools · v1\.0\.17'", "Pallet Tools · v1.0.18'", js)
          js_path.write_text(js, encoding='utf-8')

          css_path = Path('assets/theme-industrial-v130.css')
          css = css_path.read_text(encoding='utf-8')
          css = css.replace('Pallet Tools · v1.0.17 · обновление №297','Pallet Tools · v1.0.18 · обновление №299')
          css = css.replace('Pallet Tools · v1.0.17','Pallet Tools · v1.0.18')
          css_path.write_text(css, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          def bump(match):
              return f"assets/pallet3d-v10.js?v={int(match.group(1))+1}"
          index2, count = re.subn(r'assets/pallet3d-v10\.js\?v=(\d+)', bump, index, count=1)
          if count != 1:
              raise SystemExit('js cache marker not found')
          def bump_css(match):
              return f"assets/theme-industrial-v130.css?v={int(match.group(1))+1}"
          index3, count_css = re.subn(r'assets/theme-industrial-v130\.css\?v=(\d+)', bump_css, index2, count=1)
          if count_css != 1:
              raise SystemExit('css cache marker not found')
          index_path.write_text(index3, encoding='utf-8')

          workflow = Path('.github/workflows/fix-dashboard-runner-v118.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Validate JavaScript
        run: node --check assets/pallet3d-v10.js

      - name: Commit runner fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Shorten dashboard pallet runners"
          git push
