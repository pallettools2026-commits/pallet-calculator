name: Add day and night theme switch v1.1.11

on:
  push:
    branches:
      - pallet-cad-dimensions-v116

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare main
        run: |
          cp .github/scripts/day_night_theme_v111.py /tmp/day_night_theme_v111.py
          git fetch origin main
          git checkout -B main origin/main
          test "$(git rev-parse HEAD)" = "08381b36fac8c0bc4aeaedaffd81f6b9a5247b51"
      - name: Apply theme switch
        run: python3 /tmp/day_night_theme_v111.py
      - name: Validate
        run: |
          node --check assets/pallet3d-v10.js
          grep -q 'themeBootstrapV111' index.html
          grep -q 'themeRuntimeV111' index.html
          grep -q 'data-theme-toggle' index.html
          grep -q 'dayNightThemeV111' assets/theme-industrial-v130.css
          grep -q 'html\[data-theme="dark"\]' assets/theme-industrial-v130.css
          grep -q 'Pallet Tools · v1.1.11' assets/theme-industrial-v130.css
          grep -q 'обновление №345' assets/theme-industrial-v130.css
          grep -q 'Pallet Tools · v1.1.11' assets/pallet3d-v10.js
      - name: Commit to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/theme-industrial-v130.css assets/pallet3d-v10.js
          git commit -m 'Add day and night theme switch'
          git push origin HEAD:main
