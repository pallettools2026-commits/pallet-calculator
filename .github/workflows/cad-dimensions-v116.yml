name: Add smart production tools v1.1.12

on:
  push:
    branches:
      - pallet-cad-dimensions-v116

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare main
        run: |
          cp .github/scripts/smart_tools_v1112.py /tmp/smart_tools_v1112.py
          git fetch origin main
          git checkout -B main origin/main
          test "$(git rev-parse HEAD)" = "4df2b52e8e404db1a383baa270d780e43d97d63b"
      - name: Apply smart tools
        run: python3 /tmp/smart_tools_v1112.py
      - name: Validate
        run: |
          node --check assets/pallet3d-v10.js
          node --check assets/smart-tools-v1.js
          grep -q 'smartToolsCssV1112' assets/theme-industrial-v130.css
          grep -q 'palletPartInspector' assets/pallet3d-v10.js
          grep -q 'pallet3d:partselect' assets/pallet3d-v10.js
          grep -q 'smartOptimizeApply' assets/smart-tools-v1.js
          grep -q 'smartDensity' assets/smart-tools-v1.js
          grep -q 'assets/smart-tools-v1.js?v=1' index.html
          grep -q 'Pallet Tools · v1.1.12' assets/theme-industrial-v130.css
          grep -q 'обновление №346' assets/theme-industrial-v130.css
          grep -q 'Pallet Tools · v1.1.12' assets/pallet3d-v10.js
      - name: Commit to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/theme-industrial-v130.css assets/pallet3d-v10.js assets/smart-tools-v1.js
          git commit -m 'Add smart pallet optimization and inspection tools'
          git push origin HEAD:main
