name: Apply CAD pallet dimensions v1.1.8

on:
  push:
    branches:
      - pallet-cad-dimensions-v116

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare main
        run: |
          cp .github/scripts/cad_dimensions_v118.py /tmp/cad_dimensions_v118.py
          git fetch origin main
          git checkout -B main origin/main
          test "$(git rev-parse HEAD)" = "0889f5fd8b54ad00ef6aab919d9e953c481f7351"
      - name: Apply updater
        run: python3 /tmp/cad_dimensions_v118.py
      - name: Validate
        run: |
          node --check assets/pallet3d-v10.js
          grep -q "const topView=mode==='top',sideView=mode==='side'" assets/pallet3d-v10.js
          grep -q "showDeckLength=Math.abs(deckLengthMm-profile.length)>1" assets/pallet3d-v10.js
          grep -q "labelDy:topView?-17" assets/pallet3d-v10.js
          grep -q 'v1.1.8' index.html
          grep -q 'обновление №342' index.html
      - name: Commit to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pallet3d-v10.js assets/theme-industrial-v130.css index.html
          git commit -m 'Fix CAD dimensions layout by 3D view mode'
          git push origin HEAD:main
