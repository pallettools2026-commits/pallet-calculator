name: Fix 3D board picker v1.1.15

on:
  push:
    branches:
      - pallet-cad-dimensions-v116

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare main
        run: |
          cp .github/scripts/fix_3d_picker_overlay_v1115.py /tmp/fix_3d_picker_overlay_v1115.py
          git fetch origin main
          git checkout -B main origin/main
          test "$(git rev-parse HEAD)" = "a3c5dbc51957f9390ae9638928d360c9f7a5e188"
      - name: Apply picker overlay fix
        run: python3 /tmp/fix_3d_picker_overlay_v1115.py
      - name: Validate
        run: |
          node --check assets/pallet3d-v10.js
          node --check assets/smart-tools-v1.js
          grep -q 'palletBoardPickOverlay' assets/pallet3d-v10.js
          grep -q 'updatePickButtons=()=>{' assets/pallet3d-v10.js
          grep -q 'pickerOverlayV1115' assets/theme-industrial-v130.css
          grep -q 'подсвеченную область любой верхней доски' assets/smart-tools-v1.js
          grep -q 'Pallet Tools · v1.1.15' assets/theme-industrial-v130.css
          grep -q 'обновление №349' assets/theme-industrial-v130.css
      - name: Commit to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/theme-industrial-v130.css assets/pallet3d-v10.js assets/smart-tools-v1.js
          git commit -m 'Fix 3D board picker with clickable overlays'
          git push origin HEAD:main
