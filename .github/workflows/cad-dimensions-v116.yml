name: Apply CAD pallet dimensions v1.1.6

on:
  push:
    branches:
      - pallet-cad-dimensions-v116

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare main
        run: |
          cp .github/scripts/cad_dimensions_v116.py /tmp/cad_dimensions_v116.py
          git fetch origin main
          git checkout -B main origin/main
          test "$(git rev-parse HEAD)" = "22bcf3103cdae07e673b6789043cf11c40223bee"
      - name: Apply updater
        run: python3 /tmp/cad_dimensions_v116.py
      - name: Validate
        run: |
          node --check assets/pallet3d-v10.js
          grep -q 'overall-length' assets/pallet3d-v10.js
          grep -q 'board-width-' assets/pallet3d-v10.js
          grep -q 'gap-' assets/pallet3d-v10.js
          grep -q 'layer-runner' assets/pallet3d-v10.js
          grep -q 'Full CAD dimension scheme v1.1.6' assets/theme-industrial-v130.css
          grep -q 'pallet3d-v10.js?v=150' index.html
      - name: Commit to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pallet3d-v10.js assets/theme-industrial-v130.css index.html
          git commit -m 'Add full CAD dimensions to pallet 3D'
          git push origin HEAD:main
