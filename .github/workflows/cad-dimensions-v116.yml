name: Fix 3D CAD dimension clipping v1.1.10

on:
  push:
    branches:
      - pallet-cad-dimensions-v116

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare main
        run: |
          cp .github/scripts/cad_dimensions_v1110.py /tmp/cad_dimensions_v1110.py
          git fetch origin main
          git checkout -B main origin/main
          test "$(git rev-parse HEAD)" = "756b8eae4b0bfaca1d7b703d44d2277eb8825af1"
      - name: Apply updater
        run: python3 /tmp/cad_dimensions_v1110.py
      - name: Validate
        run: |
          node --check assets/pallet3d-v10.js
          grep -q 'let measureLabelBoxes=\[\]' assets/pallet3d-v10.js
          grep -q 'avoidOverlap:!topView' assets/pallet3d-v10.js
          grep -q 'Pallet Tools · v1.1.10' assets/theme-industrial-v130.css
          grep -q 'обновление №344' assets/theme-industrial-v130.css
          grep -q 'Pallet Tools · v1.1.10</div>' index.html
      - name: Commit to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pallet3d-v10.js assets/theme-industrial-v130.css index.html
          git commit -m 'Prevent CAD dimension overlap and clipping'
          git push origin HEAD:main
