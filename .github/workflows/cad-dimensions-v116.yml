name: Fix CAD pallet dimensions v1.1.7

on:
  push:
    branches:
      - pallet-cad-dimensions-v116

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify expected main
        run: test "$(git rev-parse HEAD)" = "fe7b8b50db3b2b2b8c062a82e6775e7bdfde6cc8"
      - name: Fix dimension overlay
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('assets/theme-industrial-v130.css')
          html_path = Path('index.html')
          css = css_path.read_text(encoding='utf-8')

          start = css.index('/* 3D on-model dimensions v1.1.5 */')
          end = css.index('/* Full CAD dimension scheme v1.1.6 */', start)
          css = css[:start] + '/* Legacy dimension HUD hidden; positioning is handled by the CAD overlay below */\n.palletDimensionHud{display:none!important}\n\n/* Full CAD dimension scheme v1.1.7 */' + css[end + len('/* Full CAD dimension scheme v1.1.6 */'):]

          old_mark = '.palletMeasureMark{--measure:#37699b;position:absolute!important;inset:0!important;display:none!important;color:#fff!important;font-variant-numeric:tabular-nums!important}'
          new_mark = '.palletMeasureMark{--measure:#37699b;position:absolute!important;inset:0!important;width:100%!important;height:100%!important;display:none!important;color:#fff!important;font-variant-numeric:tabular-nums!important}'
          if old_mark not in css:
              raise SystemExit('CAD mark rule not found')
          css = css.replace(old_mark, new_mark, 1)

          if 'Pallet Tools · v1.1.6' not in css:
              raise SystemExit('CSS version marker not found')
          css = css.replace('Pallet Tools · v1.1.6', 'Pallet Tools · v1.1.7')
          css = css.replace('обновление №340', 'обновление №341')
          css_path.write_text(css, encoding='utf-8')

          html = html_path.read_text(encoding='utf-8')
          if 'assets/theme-industrial-v130.css?v=154' not in html:
              raise SystemExit('theme cache marker not found')
          html = html.replace('assets/theme-industrial-v130.css?v=154', 'assets/theme-industrial-v130.css?v=155', 1)
          html = html.replace('v1.1.6', 'v1.1.7')
          html = html.replace('обновление №340', 'обновление №341')
          html_path.write_text(html, encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q 'Full CAD dimension scheme v1.1.7' assets/theme-industrial-v130.css
          grep -q 'width:100%!important;height:100%!important' assets/theme-industrial-v130.css
          ! grep -q 'position:absolute!important;width:0!important;height:0!important' assets/theme-industrial-v130.css
          grep -q 'theme-industrial-v130.css?v=155' index.html
          grep -q 'v1.1.7' index.html
      - name: Commit to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/theme-industrial-v130.css index.html
          git commit -m 'Fix CAD dimension overlay positioning'
          git push origin HEAD:main
