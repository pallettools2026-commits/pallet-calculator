name: Sidebar version source conflict v144

on:
  push:
    paths:
      - '.github/workflows/version-source-conflict-v144.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove competing version source
        run: python .github/scripts/fix_version_source_conflict_v144.py
      - name: Validate JavaScript
        run: node --check assets/pallet3d-v10.js && node --check assets/version-label-fix-v142.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pallet3d-v10.js index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Remove duplicate sidebar version source"
            git push
          fi
