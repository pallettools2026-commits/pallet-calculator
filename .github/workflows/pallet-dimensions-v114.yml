name: Apply pallet dimensions v1.1.4

on:
  push:
    branches:
      - pallet-dimensions-v114
    paths:
      - .github/workflows/pallet-dimensions-v114.yml
      - .github/scripts/pallet_dimensions_v114.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout updater branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare updater
        run: cp .github/scripts/pallet_dimensions_v114.py /tmp/pallet_dimensions_v114.py

      - name: Switch to current main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Apply live 3D dimensions
        run: python /tmp/pallet_dimensions_v114.py

      - name: Validate JavaScript
        run: node --check assets/pallet3d-v10.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pallet3d-v10.js assets/theme-industrial-v130.css index.html
          git diff --cached --check
          git commit -m "Show live pallet dimensions in 3D"
          git push origin main
