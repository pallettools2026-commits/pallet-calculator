name: Fix Three.js compatibility
on:
  push:
    paths:
      - '.github/workflows/fix-three-cdn-v82.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Three.js CDN version
        run: python .github/scripts/fix_three_cdn_v82.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Three.js browser compatibility" || exit 0
          git push
