name: Refresh dashboard pallet previews v1.0.12

on:
  push:
    paths:
      - '.github/workflows/dashboard-pallet-preview-v112.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply dashboard preview update
        run: python .github/scripts/dashboard_pallet_preview_v112.py
      - name: Validate JavaScript
        run: node --check assets/pallet3d-v10.js
      - name: Commit dashboard preview refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh dashboard pallet previews"
          git push
