name: Refresh dashboard pallet previews v1.0.12

on:
  push:
    paths:
      - '.github/workflows/dashboard-pallet-preview-v112.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build dynamic dashboard pallet previews
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('assets/pallet3d-v10.js')
          js = js_path.read_text(encoding='utf-8')

          version_marker = "  function updateSiteVersion(){const node=document.querySelector('.sideVersion');if(!node)return;const admin=typeof currentRole!=='undefined'&&currentRole==='admin';node.textContent=admin?'Pallet Tools · v1.0.10 · обновление №277':'Pallet Tools · v1.0.10';}"

          preview_fn = r'''  function setupDashboardPalletPreview(){
    const orderImg=document.querySelector('.orderFocus>img'),viewImg=document.querySelector('.dashPalletImage img');
    if(!orderImg&&!viewImg)return;
    let lastSignature='';
    const pts=a=>a.map(v=>`${v[0].toFixed(1)},${v[1].toFixed(1)}`).join(' ');
    const makeSvg=(length,width,deckCount)=>{
      length=Math.max(300,num(length,1200));width=Math.max(300,num(width,800));deckCount=clamp(Math.round(num(deckCount,7)),3,12);
      const fitX=.72*width+.48*length,fitY=.26*width+.30*length,scale=Math.min(420/fitX,145/fitY),W=width*scale,L=length*scale,cx=270,baseY=205;
      const p=(x,z,y=0)=>[cx+x*.72-z*.48,baseY+x*.26+z*.30-y];
      const prism=(x0,z0,x1,z1,y,h,top,front,side)=>{const A=p(x0,z0,y+h),B=p(x1,z0,y+h),C=p(x1,z1,y+h),D=p(x0,z1,y+h),B0=p(x1,z0,y),C0=p(x1,z1,y),D0=p(x0,z1,y);return `<polygon points="${pts([D,C,C0,D0])}" fill="${front}"/><polygon points="${pts([B,C,C0,B0])}" fill="${side}"/><polygon points="${pts([A,B,C,D])}" fill="${top}" stroke="#8d623b" stroke-opacity=".24" stroke-width=".8"/>`;};
      let shape='';
      const runnerCenters=[-W*.36,0,W*.36],runnerW=Math.max(11,W*.13),runnerH=11;
      runnerCenters.forEach(x=>shape+=prism(x-runnerW/2,-L/2,x+runnerW/2,L/2,0,runnerH,'url(#runnerTop)','#b6783f','#925b31'));
      const blockW=Math.max(15,W*.16),blockL=Math.max(15,L*.11),blockH=28;
      runnerCenters.forEach(x=>[-L*.36,0,L*.36].forEach(z=>shape+=prism(x-blockW/2,z-blockL/2,x+blockW/2,z+blockL/2,runnerH,blockH,'url(#blockTop)','#c4874d','#9d6337')));
      const crossH=9,crossDepth=Math.max(9,L*.055);
      [-L*.36,0,L*.36].forEach(z=>shape+=prism(-W/2,z-crossDepth/2,W/2,z+crossDepth/2,runnerH+blockH,crossH,'url(#crossTop)','#d7a46d','#af7744'));
      const deckH=9,deckW=Math.max(8,Math.min(W*.13,W*.82/deckCount));
      for(let i=0;i<deckCount;i++){const x=deckCount===1?0:-W/2+deckW/2+i*(W-deckW)/(deckCount-1);shape+=prism(x-deckW/2,-L/2,x+deckW/2,L/2,runnerH+blockH+crossH,deckH,'url(#deckTop)','#e1b77f','#bd8952');}
      const shadowRx=Math.min(190,(W*.72+L*.48)*.46);
      const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" role="img" aria-label="Поддон ${Math.round(length)} на ${Math.round(width)} миллиметров"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f3eee6"/></linearGradient><linearGradient id="deckTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6d7aa"/><stop offset=".52" stop-color="#e8bd83"/><stop offset="1" stop-color="#d9a86d"/></linearGradient><linearGradient id="crossTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#efc994"/><stop offset="1" stop-color="#dca66b"/></linearGradient><linearGradient id="blockTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e4b57b"/><stop offset="1" stop-color="#c98d52"/></linearGradient><linearGradient id="runnerTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dca86d"/><stop offset="1" stop-color="#bd7d43"/></linearGradient><filter id="soft"><feGaussianBlur stdDeviation="8"/></filter></defs><rect width="540" height="300" rx="24" fill="url(#bg)"/><ellipse cx="270" cy="235" rx="${shadowRx.toFixed(1)}" ry="24" fill="#66513b" opacity=".15" filter="url(#soft)"/>${shape}<g opacity=".18" stroke="#88592f" stroke-width="1"><path d="M126 77 C220 112 320 91 417 126"/><path d="M108 110 C223 146 325 122 438 160"/></g><text x="270" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#75695d">${Math.round(length)} × ${Math.round(width)} мм · настил ${deckCount} шт.</text></svg>`;
      return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg);
    };
    const refresh=()=>{const length=num(el('pL')?.value,1200),width=num(el('pW')?.value,800),deckCount=num(el('n0')?.value,7),signature=`${length}|${width}|${deckCount}`;if(signature===lastSignature)return;lastSignature=signature;const src=makeSvg(length,width,deckCount);[orderImg,viewImg].forEach(img=>{if(!img)return;img.src=src;img.alt=`Поддон ${Math.round(length)} × ${Math.round(width)} мм`;img.classList.add('dashDynamicPallet');});};
    ['pL','pW','n0'].forEach(id=>{const input=el(id);if(!input||input.dataset.dashboardPreviewReady==='1')return;input.dataset.dashboardPreviewReady='1';input.addEventListener('input',refresh);input.addEventListener('change',refresh);});
    refresh();setInterval(refresh,1500);
  }

'''

          if 'function setupDashboardPalletPreview()' not in js:
              if version_marker not in js:
                  raise SystemExit('updateSiteVersion marker not found')
              js = js.replace(version_marker, preview_fn + version_marker, 1)

          js = js.replace("Pallet Tools · v1.0.10 · обновление №277", "Pallet Tools · v1.0.12 · обновление №283")
          js = js.replace("Pallet Tools · v1.0.10'", "Pallet Tools · v1.0.12'")

          old_init = "setupDeckCountControl();setupAdminEmployeeDelete();setupAdminEmployeeInvite();setupPrivateRegistration();setupPasswordRecovery();setupUserPresence();setupAdminPresenceStatus();updateSiteVersion();"
          new_init = "setupDeckCountControl();setupAdminEmployeeDelete();setupAdminEmployeeInvite();setupPrivateRegistration();setupPasswordRecovery();setupUserPresence();setupAdminPresenceStatus();setupDashboardPalletPreview();updateSiteVersion();"
          if old_init in js:
              js = js.replace(old_init, new_init, 1)
          elif 'setupDashboardPalletPreview();updateSiteVersion();' not in js:
              raise SystemExit('initialization marker not found')
          js_path.write_text(js, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          replacements = {
              'assets/theme-industrial-v130.css?v=130': 'assets/theme-industrial-v130.css?v=132',
              'assets/pallet3d-v10.js?v=127': 'assets/pallet3d-v10.js?v=128',
              'src="assets/pallet-clean-3d-2.webp" alt="Чистый деревянный поддон"': 'src="assets/pallet-clean-3d-1.webp" alt="Актуальный вид деревянного поддона"',
              'src="assets/pallet-clean-3d-2.webp" alt="Деревянный поддон"': 'src="assets/pallet-clean-3d-1.webp" alt="Актуальный вид деревянного поддона"',
          }
          for old,new in replacements.items():
              if old not in index:
                  raise SystemExit(f'index marker not found: {old}')
              index = index.replace(old,new,1)
          index_path.write_text(index, encoding='utf-8')

          css_path = Path('assets/theme-industrial-v130.css')
          css = css_path.read_text(encoding='utf-8')
          css = css.replace('Pallet Tools · v1.0.11 · обновление №281','Pallet Tools · v1.0.12 · обновление №283')
          css = css.replace('Pallet Tools · v1.0.11','Pallet Tools · v1.0.12')
          if 'Dashboard live pallet preview v1.0.12' not in css:
              css += r'''

/* Dashboard live pallet preview v1.0.12 */
.orderFocus>img.dashDynamicPallet{width:154px!important;max-width:30%!important;height:116px!important;object-fit:contain!important;padding:3px!important;border:1px solid #e6ded3!important;border-radius:16px!important;background:linear-gradient(145deg,#fff,#f4efe7)!important;box-shadow:0 10px 24px rgba(73,56,39,.11)!important;filter:none!important;transform:none!important}
.dashPalletImage{position:relative!important;overflow:hidden!important;display:flex!important;align-items:center!important;justify-content:center!important;min-height:232px!important;border:1px solid #e7e0d6!important;border-radius:18px!important;background:radial-gradient(circle at 50% 34%,#fff 0%,#f8f5ef 56%,#efe9df 100%)!important}
.dashPalletImage:before{content:"";position:absolute!important;inset:0!important;pointer-events:none!important;background:linear-gradient(90deg,rgba(137,115,91,.035) 1px,transparent 1px),linear-gradient(rgba(137,115,91,.035) 1px,transparent 1px)!important;background-size:22px 22px!important;mask-image:linear-gradient(to bottom,rgba(0,0,0,.6),transparent 88%)!important}
.dashPalletImage img.dashDynamicPallet{position:relative!important;z-index:1!important;width:min(96%,440px)!important;height:218px!important;object-fit:contain!important;filter:drop-shadow(0 14px 15px rgba(72,55,38,.14))!important;transform:none!important}
.palletViewPanel .dashPanelHead{margin-bottom:12px!important}
.palletViewPanel .dashPanelHead p{font-weight:750!important;color:#8d6540!important}
@media(max-width:760px){.orderFocus>img.dashDynamicPallet{width:132px!important;max-width:38%!important;height:102px!important}.dashPalletImage{min-height:205px!important}.dashPalletImage img.dashDynamicPallet{height:192px!important}}
@media(max-width:520px){.orderFocus>img.dashDynamicPallet{width:112px!important;max-width:42%!important;height:88px!important}.dashPalletImage{min-height:180px!important}.dashPalletImage img.dashDynamicPallet{height:168px!important}}
'''
          css_path.write_text(css, encoding='utf-8')

          workflow = Path('.github/workflows/dashboard-pallet-preview-v112.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Validate JavaScript
        run: node --check assets/pallet3d-v10.js

      - name: Commit dashboard preview refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh dashboard pallet previews"
          git push
