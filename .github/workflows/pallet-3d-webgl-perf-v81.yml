name: Refine WebGL pallet performance
on:
  push:
    paths:
      - '.github/workflows/pallet-3d-webgl-perf-v81.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve WebGL camera performance
        run: python .github/scripts/pallet_3d_webgl_perf_v81.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make pallet WebGL rotation smooth" || exit 0
          git push
