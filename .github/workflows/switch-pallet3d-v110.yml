name: Switch Pallet 3D v110
on:
  push:
    paths:
      - '.github/workflows/switch-pallet3d-v110.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch pallet 3D asset
        run: python .github/scripts/switch_pallet3d_v110.py
      - name: Commit index update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use improved Pallet 3D renderer" || exit 0
          git push
