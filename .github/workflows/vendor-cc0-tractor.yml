name: Vendor CC0 tractor asset

on:
  push:
    paths:
      - '.github/workflows/vendor-cc0-tractor.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download CC0 long-nose tractor GLB
        run: |
          mkdir -p assets/models
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://cdn.3dassets.dev/assets/13943/v1/model.glb' \
            --output assets/models/longnose-cc0.glb
          test -s assets/models/longnose-cc0.glb
          echo "Downloaded $(wc -c < assets/models/longnose-cc0.glb) bytes"

      - name: Commit vendored model
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/models/longnose-cc0.glb
          if git diff --cached --quiet; then
            echo 'Asset already up to date'
          else
            git commit -m 'Vendor CC0 long-nose tractor GLB'
            git push origin HEAD:main
          fi
