name: Rebuild pallet 3D V9
on:
  push:
    paths:
      - '.github/workflows/rebuild-pallet-3d-v9.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild pallet 3D
        run: python .github/scripts/rebuild_pallet_3d_v9.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild pallet preview as realistic 3D V9" || exit 0
          git push
