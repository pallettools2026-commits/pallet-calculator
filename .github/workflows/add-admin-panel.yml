name: Add admin panel and cloud calculations

on:
  push:
    paths:
      - '.github/workflows/add-admin-panel.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          css=base64.b64decode('').decode('utf-8')
          html=base64.b64decode('').decode('utf-8')
          js=base64.b64decode('').decode('utf-8')
          if '.adminPanel{' not in text:
              text=text.replace('</style>',css+'\n</style>',1)
          if 'id="adminPanel"' not in text:
              text=text.replace('<section class="result">',html+'\n<section class="result">',1)
          if 'const ADMIN_CLOUD_V1=true;' not in text:
              marker='syncAutoLengths();\ncalc();\nloadSaved();'
              if marker not in text:
                  raise SystemExit('JS insertion marker not found')
              text=text.replace(marker,js+'\n\n'+marker,1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add admin panel and cloud calculations"
          git push
