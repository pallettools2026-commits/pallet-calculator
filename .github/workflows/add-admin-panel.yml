name: Add admin panel and cloud calculations

on:
  push:
    paths:
      - '.github/workflows/add-admin-panel.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          text=p.read_text(encoding='utf-8')

          css=r'''
.adminPanel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin:18px 0;box-shadow:var(--shadow);color:var(--text)}
.adminHead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.adminHead h2{margin:4px 0 2px}
.adminBadge{display:inline-flex;align-items:center;gap:6px;background:#e3f3ec;color:#155746;border:1px solid #b9d9cc;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800}
.adminSub{font-size:13px;color:var(--muted)}
.adminRefresh{border:1px solid #c8d8d1;background:#f7faf8;color:#244b40;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}
.adminStats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.adminStat{background:var(--surface-soft);border:1px solid var(--line);border-radius:14px;padding:12px}
.adminStat small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.adminStat b{display:block;font-size:24px;color:var(--primary-deep);margin-top:3px}
.adminGrid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:14px}
.adminBox{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fbfdfc;min-width:0}
.adminBox h3{margin:0 0 10px;font-size:16px;color:#21483d}
.adminUser,.adminCalc{border-top:1px solid #e4ece8;padding:10px 0}
.adminUser:first-child,.adminCalc:first-child{border-top:0}
.adminUser{display:flex;align-items:center;justify-content:space-between;gap:10px}
.adminEmail{font-weight:700;overflow-wrap:anywhere}
.adminMeta{font-size:12px;color:var(--muted);margin-top:3px}
.adminRole{min-height:36px;border:1px solid #cbd9d2;border-radius:9px;background:#fff;padding:6px 8px;color:var(--text);font-weight:700}
.adminCalcTitle{font-weight:800;color:#173c33}
.adminCalcItems{margin-top:7px;display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:12px;color:#4d625a}
.adminEmpty{font-size:13px;color:var(--muted);padding:8px 0}
@media(max-width:820px){.adminGrid{grid-template-columns:1fr}.adminStats{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:520px){.adminStats{grid-template-columns:1fr}.adminUser{align-items:flex-start;flex-direction:column}.adminRole{width:100%}.adminCalcItems{grid-template-columns:1fr}}
@media print{.adminPanel{display:none!important}}
'''
          if '.adminPanel{' not in text:
              text=text.replace('</style>',css+'\n</style>',1)

          html=r'''
<section class="adminPanel" id="adminPanel" style="display:none">
  <div class="adminHead">
    <div><span class="adminBadge">🛡 Администратор</span><h2>Админ-панель</h2><div class="adminSub">Пользователи и расчёты сотрудников</div></div>
    <button class="adminRefresh" id="adminRefresh" type="button">Обновить</button>
  </div>
  <div class="adminStats">
    <div class="adminStat"><small>Пользователи</small><b id="adminUsersCount">0</b></div>
    <div class="adminStat"><small>Администраторы</small><b id="adminAdminsCount">0</b></div>
    <div class="adminStat"><small>Расчёты</small><b id="adminCalcsCount">0</b></div>
  </div>
  <div class="adminGrid">
    <div class="adminBox"><h3>Пользователи</h3><div id="adminUsersList" class="adminEmpty">Загрузка…</div></div>
    <div class="adminBox"><h3>Последние расчёты</h3><div id="adminCalcsList" class="adminEmpty">Загрузка…</div></div>
  </div>
</section>
'''
          if 'id="adminPanel"' not in text:
              text=text.replace('<section class="result">',html+'\n<section class="result">',1)

          js=r'''
const ADMIN_CLOUD_V1=true;
var currentUser=null;
var currentRole="employee";

function esc(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function localSaved(){try{const raw=localStorage.getItem(STORAGE_KEY);const arr=raw?JSON.parse(raw):[];return Array.isArray(arr)?arr:[];}catch(e){return [];}}
function dbRecord(row){
 const payload=row.calculation_data&&typeof row.calculation_data==="object"?row.calculation_data:{};
 return {id:payload.legacy_id||row.id,cloudId:row.id,created:new Date(row.created_at).toLocaleString("ru-RU"),palletLength:Number(row.pallet_length),palletWidth:Number(row.pallet_width),quantity:Number(row.pallet_count),orderNo:row.order_number||"",worker:row.employee_name||row.shift_name||"",jobDate:row.work_date||"",items:Array.isArray(payload.items)?payload.items:[]};
}
function toDb(rec){return {user_id:currentUser.id,order_number:rec.orderNo||null,shift_name:null,employee_name:rec.worker||null,work_date:rec.jobDate||new Date().toISOString().slice(0,10),pallet_length:rec.palletLength,pallet_width:rec.palletWidth,pallet_count:rec.quantity,calculation_data:{items:rec.items||[],legacy_id:rec.id}};}

async function showSession(session){
 const user=session?.user;
 currentUser=user||null;
 currentRole="employee";
 const panel=document.getElementById("adminPanel");
 if(user){
   let role=user.app_metadata?.role||"employee";
   try{const {data}=await sb.from("profiles").select("role,email").eq("id",user.id).single();if(data?.role)role=data.role;}catch(e){}
   currentRole=role;
   const admin=role==="admin";
   authState.innerHTML=`Вы вошли как <span class="authUser">${esc(user.email||"пользователь")}</span>${admin?' <span class="adminBadge">🛡 Администратор</span>':''}`;
   authFields.style.display="none";logoutBtn.style.display="inline-block";protectedApp.classList.remove("appLocked");if(panel)panel.style.display=admin?"block":"none";
   setAuthMessage(admin?"Вход выполнен. Открыт режим администратора.":"Вход выполнен. Калькулятор открыт.");
   await loadSaved();
   if(admin)await loadAdminData();
 }else{
   authState.textContent="Войдите или создайте аккаунт.";authFields.style.display="grid";logoutBtn.style.display="none";protectedApp.classList.add("appLocked");if(panel)panel.style.display="none";
   setAuthMessage("После регистрации Supabase отправит письмо для подтверждения email.");
 }
}

function persistSaved(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(saved));}catch(e){}}

async function loadSaved(){
 const local=localSaved();
 if(!currentUser){saved=local;renderSaved();return;}
 let {data:cloud,error}=await sb.from("calculations").select("*").eq("user_id",currentUser.id).order("created_at",{ascending:false});
 if(!error&&(!cloud||cloud.length===0)&&local.length){
   const rows=local.map(toDb);
   const ins=await sb.from("calculations").insert(rows);
   if(!ins.error){const again=await sb.from("calculations").select("*").eq("user_id",currentUser.id).order("created_at",{ascending:false});cloud=again.data||[];error=again.error;}
 }
 if(error){saved=local;renderSaved();return;}
 saved=(cloud||[]).map(dbRecord);persistSaved();renderSaved();
}

function renderSaved(){
 const list=document.getElementById("savedList");
 if(saved.length===0){list.className="savedEmpty";list.innerHTML="Пока ничего не сохранено.";return;}
 list.className="";list.innerHTML="";
 saved.forEach((rec,index)=>{
   const item=document.createElement("div");item.className="savedItem";
   const rows=(rec.items||[]).map(it=>`<div class="savedRow"><span>${esc(it.name)}<br><small>${Number(it.t||0)} × ${Number(it.w||0)} × ${Number(it.l||0)} мм</small></span><b>${Number(it.total||0).toLocaleString("ru-RU")} шт.</b></div>`).join("");
   item.innerHTML=`<div class="savedHead"><div><div class="savedTitle">${Number(rec.palletLength)} × ${Number(rec.palletWidth)} мм — ${Number(rec.quantity).toLocaleString("ru-RU")} подд.</div><div class="savedMeta">${esc(rec.created||"")}${rec.orderNo?` • Заказ: ${esc(rec.orderNo)}`:""}${rec.worker?` • ${esc(rec.worker)}`:""}${rec.jobDate?` • ${esc(rec.jobDate)}`:""}</div></div><button class="deleteSaved" type="button" data-index="${index}">Удалить</button></div><div class="savedRows">${rows}</div>`;
   list.appendChild(item);
 });
 list.querySelectorAll(".deleteSaved").forEach(btn=>btn.addEventListener("click",async()=>{
   const i=Number(btn.dataset.index),rec=saved[i];
   if(currentUser&&rec?.cloudId){const {error}=await sb.from("calculations").delete().eq("id",rec.cloudId);if(error){alert("Не удалось удалить расчёт: "+error.message);return;}await loadSaved();if(currentRole==="admin")await loadAdminData();}
   else{saved.splice(i,1);persistSaved();renderSaved();}
 }));
}

async function loadAdminData(){
 if(currentRole!=="admin")return;
 const usersBox=document.getElementById("adminUsersList"),calcsBox=document.getElementById("adminCalcsList");
 if(usersBox)usersBox.innerHTML="Загрузка…";if(calcsBox)calcsBox.innerHTML="Загрузка…";
 const [pu,pc]=await Promise.all([
   sb.from("profiles").select("id,email,full_name,role,created_at").order("created_at",{ascending:true}),
   sb.from("calculations").select("*").order("created_at",{ascending:false}).limit(150)
 ]);
 if(pu.error){if(usersBox)usersBox.textContent="Ошибка: "+pu.error.message;return;}
 const profiles=pu.data||[],calcs=pc.data||[],names=new Map(profiles.map(p=>[p.id,p]));
 document.getElementById("adminUsersCount").textContent=profiles.length;
 document.getElementById("adminAdminsCount").textContent=profiles.filter(p=>p.role==="admin").length;
 document.getElementById("adminCalcsCount").textContent=pc.error?"—":calcs.length;
 usersBox.className=profiles.length?"":"adminEmpty";
 usersBox.innerHTML=profiles.length?profiles.map(p=>`<div class="adminUser"><div><div class="adminEmail">${esc(p.email||"Без email")}${p.id===currentUser?.id?' <span class="adminBadge">Вы</span>':''}</div><div class="adminMeta">Создан: ${new Date(p.created_at).toLocaleDateString("ru-RU")}</div></div><select class="adminRole" data-user="${p.id}" ${p.id===currentUser?.id?'disabled':''}><option value="employee" ${p.role==="employee"?'selected':''}>Сотрудник</option><option value="admin" ${p.role==="admin"?'selected':''}>Администратор</option></select></div>`).join(""):"Пользователей пока нет.";
 usersBox.querySelectorAll(".adminRole").forEach(sel=>sel.addEventListener("change",async()=>{
   sel.disabled=true;const {error}=await sb.from("profiles").update({role:sel.value}).eq("id",sel.dataset.user);sel.disabled=false;
   if(error){alert("Не удалось изменить роль: "+error.message);await loadAdminData();return;}
   await loadAdminData();
 }));
 if(pc.error){calcsBox.className="adminEmpty";calcsBox.textContent="Ошибка: "+pc.error.message;return;}
 calcsBox.className=calcs.length?"":"adminEmpty";
 calcsBox.innerHTML=calcs.length?calcs.map(row=>{const rec=dbRecord(row),profile=names.get(row.user_id),items=(rec.items||[]).slice(0,8).map(it=>`<span>${esc(it.name)}: <b>${Number(it.total||0).toLocaleString("ru-RU")}</b></span>`).join("");return `<div class="adminCalc"><div class="adminCalcTitle">${Number(rec.palletLength)} × ${Number(rec.palletWidth)} мм — ${Number(rec.quantity).toLocaleString("ru-RU")} подд.</div><div class="adminMeta">${esc(profile?.email||"Пользователь")} • ${new Date(row.created_at).toLocaleString("ru-RU")}${rec.orderNo?` • Заказ: ${esc(rec.orderNo)}`:""}${rec.worker?` • ${esc(rec.worker)}`:""}</div><div class="adminCalcItems">${items||"Нет позиций"}</div></div>`;}).join(""):"Расчётов пока нет.";
}

document.getElementById("adminRefresh")?.addEventListener("click",loadAdminData);

document.getElementById("saveBtn").addEventListener("click",async e=>{
 e.preventDefault();e.stopImmediatePropagation();
 const rec=currentRecord();if(!rec){alert("Проверь размер поддона и количество.");return;}
 if(!currentUser){alert("Сначала войдите в аккаунт.");return;}
 const btn=e.currentTarget;btn.disabled=true;
 const {error}=await sb.from("calculations").insert(toDb(rec));btn.disabled=false;
 if(error){alert("Не удалось сохранить расчёт: "+error.message);return;}
 await loadSaved();if(currentRole==="admin")await loadAdminData();alert("Расчёт сохранён в облаке.");
},true);

document.getElementById("clearBtn").addEventListener("click",async e=>{
 e.preventDefault();e.stopImmediatePropagation();if(saved.length===0)return;
 if(!confirm("Удалить все ваши сохранённые расчёты?"))return;
 if(currentUser){const {error}=await sb.from("calculations").delete().eq("user_id",currentUser.id);if(error){alert("Не удалось удалить расчёты: "+error.message);return;}}
 saved=[];persistSaved();renderSaved();if(currentRole==="admin")await loadAdminData();
},true);
'''
          if 'const ADMIN_CLOUD_V1=true;' not in text:
              marker='syncAutoLengths();\ncalc();\nloadSaved();'
              if marker not in text:
                  raise SystemExit('JS insertion marker not found')
              text=text.replace(marker,js+'\n\n'+marker,1)

          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add admin panel and cloud calculations"
          git push
