name: Check pallet 3D v93
on:
  push:
    paths:
      - '.github/workflows/check-pallet3d-v93.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix final syntax and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/pallet3d-v9.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("emissiveIntensity:selected===kind?.11:0","emissiveIntensity:selected===kind ? .11 : 0")
          p.write_text(s,encoding='utf-8')
          PY
          node --check assets/pallet3d-v9.js
      - name: Commit validated module
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pallet3d-v9.js
          git commit -m "Validate rebuilt pallet 3D module" || exit 0
          git push
