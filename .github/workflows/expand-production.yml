name: Expand production management

on:
  push:
    paths:
      - '.github/workflows/expand-production.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply production expansion
        run: python .github/scripts/expand_production.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add production cost flow and offcut tools"
          git push
