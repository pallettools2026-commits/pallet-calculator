name: Upgrade pallet 3D model
on:
  push:
    paths:
      - '.github/workflows/upgrade-pallet-3d-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply detailed 3D pallet model
        run: python .github/scripts/upgrade_pallet_3d_v2.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade pallet preview to detailed 3D model"
          git push
