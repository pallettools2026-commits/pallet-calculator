name: Fix dashboard pallet preview containment v1.0.15

on:
  push:
    paths:
      - '.github/workflows/fix-dashboard-preview-containment-v115.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix dashboard preview geometry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('assets/pallet3d-v10.js')
          js = js_path.read_text(encoding='utf-8')
          replacements = [
              ("const fitX=.72*width+.48*length,fitY=.26*width+.30*length,scale=Math.min(380/fitX,132/fitY),W=width*scale,L=length*scale,cx=270,baseY=202;", "const fitX=.72*width+.48*length,fitY=.26*width+.30*length,scale=Math.min(300/fitX,96/fitY),W=width*scale,L=length*scale,cx=270,baseY=183;"),
              ("const runnerCenters=[-W*.36,0,W*.36],runnerW=Math.max(11,W*.13),runnerH=11;", "const runnerCenters=[-W*.32,0,W*.32],runnerW=Math.max(11,W*.12),runnerH=11;"),
              ("runnerCenters.forEach(x=>shape+=prism(x-runnerW/2,-L/2,x+runnerW/2,L/2,0,runnerH,'url(#runnerTop)','#b6783f','#925b31'));", "runnerCenters.forEach(x=>shape+=prism(x-runnerW/2,-L*.42,x+runnerW/2,L*.42,0,runnerH,'url(#runnerTop)','#b6783f','#925b31'));"),
              ("runnerCenters.forEach(x=>[-L*.36,0,L*.36].forEach(z=>shape+=prism(x-blockW/2,z-blockL/2,x+blockW/2,z+blockL/2,runnerH,blockH,'url(#blockTop)','#c4874d','#9d6337')));", "runnerCenters.forEach(x=>[-L*.31,0,L*.31].forEach(z=>shape+=prism(x-blockW/2,z-blockL/2,x+blockW/2,z+blockL/2,runnerH,blockH,'url(#blockTop)','#c4874d','#9d6337')));"),
              ("[-L*.36,0,L*.36].forEach(z=>shape+=prism(-W/2,z-crossDepth/2,W/2,z+crossDepth/2,runnerH+blockH,crossH,'url(#crossTop)','#d7a46d','#af7744'));", "[-L*.31,0,L*.31].forEach(z=>shape+=prism(-W*.44,z-crossDepth/2,W*.44,z+crossDepth/2,runnerH+blockH,crossH,'url(#crossTop)','#d7a46d','#af7744'));"),
              ("for(let i=0;i<deckCount;i++){const x=-W/2+deckW/2+i*(W-deckW)/(deckCount-1);shape+=prism(x-deckW/2,-L/2,x+deckW/2,L/2,runnerH+blockH+crossH,deckH,'url(#deckTop)','#e1b77f','#bd8952');}", "for(let i=0;i<deckCount;i++){const x=-W*.44+deckW/2+i*(W*.88-deckW)/(deckCount-1);shape+=prism(x-deckW/2,-L*.44,x+deckW/2,L*.44,runnerH+blockH+crossH,deckH,'url(#deckTop)','#e1b77f','#bd8952');}"),
              ("const shadowRx=Math.min(190,(W*.72+L*.48)*.46);", "const shadowRx=Math.min(130,(W*.72+L*.48)*.40);"),
              ("<rect width=\"540\" height=\"300\" rx=\"24\" fill=\"url(#bg)\"/>", "<rect width=\"540\" height=\"300\" rx=\"24\" fill=\"#fbfaf7\"/>"),
              ("Pallet Tools · v1.0.14 · обновление №289", "Pallet Tools · v1.0.15 · обновление №292"),
              ("Pallet Tools · v1.0.14'", "Pallet Tools · v1.0.15'")
          ]
          for old,new in replacements:
              if old not in js:
                  raise SystemExit('missing JS marker: '+old[:80])
              js = js.replace(old,new,1)
          js_path.write_text(js,encoding='utf-8')

          css_path = Path('assets/theme-industrial-v130.css')
          css = css_path.read_text(encoding='utf-8')
          css = css.replace('Pallet Tools · v1.0.14 · обновление №289','Pallet Tools · v1.0.15 · обновление №292')
          css = css.replace('Pallet Tools · v1.0.14','Pallet Tools · v1.0.15')
          css = css.replace('Dashboard live pallet preview v1.0.14','Dashboard live pallet preview v1.0.15')
          css = css.replace('width:min(88%,400px)!important;height:198px!important;object-fit:contain!important;padding:8px!important','width:min(80%,350px)!important;height:180px!important;object-fit:contain!important;padding:12px!important')
          css = css.replace('height:176px!important','height:162px!important').replace('height:154px!important','height:142px!important')
          css_path.write_text(css,encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          if 'assets/theme-industrial-v130.css?v=134' not in index or 'assets/pallet3d-v10.js?v=130' not in index:
              raise SystemExit('cache markers not found')
          index = index.replace('assets/theme-industrial-v130.css?v=134','assets/theme-industrial-v130.css?v=135',1)
          index = index.replace('assets/pallet3d-v10.js?v=130','assets/pallet3d-v10.js?v=131',1)
          index_path.write_text(index,encoding='utf-8')

          Path('.github/workflows/fix-dashboard-preview-containment-v115.yml').unlink(missing_ok=True)
          PY

      - name: Validate JavaScript
        run: node --check assets/pallet3d-v10.js

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Contain dashboard pallet preview"
          git push
