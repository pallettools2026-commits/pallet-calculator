name: Fix dashboard pallet preview containment v1.0.15

on:
  push:
    paths:
      - '.github/workflows/fix-dashboard-preview-containment-v115.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace dashboard pallet preview with contained render
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('assets/pallet3d-v10.js')
          js = js_path.read_text(encoding='utf-8')
          start = js.find('  function setupDashboardPalletPreview(){')
          end = js.find('  function updateSiteVersion()', start)
          if start < 0 or end < 0:
              raise SystemExit('dashboard preview function markers not found')

          replacement = r'''  function setupDashboardPalletPreview(){
    const orderImg=document.querySelector('.orderFocus>img'),viewImg=document.querySelector('.dashPalletImage img');
    if(!orderImg&&!viewImg)return;
    let lastSignature='';
    const pts=a=>a.map(v=>`${v[0].toFixed(1)},${v[1].toFixed(1)}`).join(' ');
    const makeSvg=(length,width,deckCount)=>{
      length=Math.max(300,num(length,1200));width=Math.max(300,num(width,800));deckCount=clamp(Math.round(num(deckCount,7)),3,12);
      const fitX=.70*width+.46*length,fitY=.25*width+.28*length;
      const scale=Math.min(322/fitX,104/fitY),W=width*scale,L=length*scale,cx=270,baseY=186;
      const p=(x,z,y=0)=>[cx+x*.70-z*.46,baseY+x*.25+z*.28-y];
      const prism=(x0,z0,x1,z1,y,h,top,front,side)=>{const A=p(x0,z0,y+h),B=p(x1,z0,y+h),C=p(x1,z1,y+h),D=p(x0,z1,y+h),B0=p(x1,z0,y),C0=p(x1,z1,y),D0=p(x0,z1,y);return `<polygon points="${pts([D,C,C0,D0])}" fill="${front}"/><polygon points="${pts([B,C,C0,B0])}" fill="${side}"/><polygon points="${pts([A,B,C,D])}" fill="${top}" stroke="#93683f" stroke-opacity=".30" stroke-width=".75"/>`;};
      let shape='';
      const runnerCenters=[-W*.34,0,W*.34],runnerW=Math.max(10,W*.12),runnerH=10;
      runnerCenters.forEach(x=>shape+=prism(x-runnerW/2,-L*.45,x+runnerW/2,L*.45,0,runnerH,'#d5a368','#ad713d','#8f582f'));
      const blockW=Math.max(14,W*.15),blockL=Math.max(14,L*.105),blockH=26;
      runnerCenters.forEach(x=>[-L*.33,0,L*.33].forEach(z=>shape+=prism(x-blockW/2,z-blockL/2,x+blockW/2,z+blockL/2,runnerH,blockH,'#dfb178','#bd7d48','#985e34')));
      const crossH=8,crossDepth=Math.max(9,L*.05);
      [-L*.33,0,L*.33].forEach(z=>shape+=prism(-W*.46,z-crossDepth/2,W*.46,z+crossDepth/2,runnerH+blockH,crossH,'#ecc38f','#cf9862','#ab7240'));
      const deckH=8,deckW=Math.max(8,Math.min(W*.13,W*.80/deckCount));
      for(let i=0;i<deckCount;i++){const x=-W*.46+deckW/2+i*(W*.92-deckW)/(deckCount-1);shape+=prism(x-deckW/2,-L*.46,x+deckW/2,L*.46,runnerH+blockH+crossH,deckH,'#efca96','#d9a86f','#b77f49');}
      const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" role="img" aria-label="Поддон ${Math.round(length)} на ${Math.round(width)} миллиметров"><defs><clipPath id="previewClip"><rect x="42" y="24" width="456" height="218" rx="20"/></clipPath><filter id="soft" x="-20%" y="-30%" width="140%" height="180%"><feGaussianBlur stdDeviation="5"/></filter></defs><rect x="42" y="24" width="456" height="218" rx="20" fill="#fbfaf7"/><g clip-path="url(#previewClip)"><ellipse cx="270" cy="218" rx="142" ry="16" fill="#6b5742" opacity=".10" filter="url(#soft)"/>${shape}</g><text x="270" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#75695d">${Math.round(length)} × ${Math.round(width)} мм · настил ${deckCount} шт.</text></svg>`;
      return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg);
    };
    const refresh=()=>{const length=num(el('pL')?.value,1200),width=num(el('pW')?.value,800),deckCount=num(el('n0')?.value,7),signature=`${length}|${width}|${deckCount}`;if(signature===lastSignature)return;lastSignature=signature;const src=makeSvg(length,width,deckCount);[orderImg,viewImg].forEach(img=>{if(!img)return;img.src=src;img.alt=`Поддон ${Math.round(length)} × ${Math.round(width)} мм`;img.classList.add('dashDynamicPallet');});};
    ['pL','pW','n0'].forEach(id=>{const input=el(id);if(!input||input.dataset.dashboardPreviewReady==='1')return;input.dataset.dashboardPreviewReady='1';input.addEventListener('input',refresh);input.addEventListener('change',refresh);});
    refresh();setInterval(refresh,1500);
  }

'''
          js = js[:start] + replacement + js[end:]
          js = js.replace("Pallet Tools · v1.0.14 · обновление №289", "Pallet Tools · v1.0.15 · обновление №291")
          js = js.replace("Pallet Tools · v1.0.14'", "Pallet Tools · v1.0.15'")
          js_path.write_text(js, encoding='utf-8')

          css_path = Path('assets/theme-industrial-v130.css')
          css = css_path.read_text(encoding='utf-8')
          css = css.replace('Pallet Tools · v1.0.14 · обновление №289','Pallet Tools · v1.0.15 · обновление №291')
          css = css.replace('Pallet Tools · v1.0.14','Pallet Tools · v1.0.15')
          css = css.replace('Dashboard live pallet preview v1.0.14','Dashboard live pallet preview v1.0.15')
          css = css.replace('background:radial-gradient(circle at 50% 34%,#fff 0%,#f8f5ef 56%,#efe9df 100%)!important','background:#fbfaf7!important')
          css = css.replace('width:min(88%,400px)!important;height:198px!important;object-fit:contain!important;padding:8px!important','width:min(82%,372px)!important;height:190px!important;object-fit:contain!important;padding:10px!important')
          css = css.replace('height:176px!important','height:170px!important').replace('height:154px!important','height:148px!important')
          css_path.write_text(css, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          if 'assets/theme-industrial-v130.css?v=134' not in index:
              raise SystemExit('theme cache marker not found')
          if 'assets/pallet3d-v10.js?v=130' not in index:
              raise SystemExit('js cache marker not found')
          index = index.replace('assets/theme-industrial-v130.css?v=134','assets/theme-industrial-v130.css?v=135',1)
          index = index.replace('assets/pallet3d-v10.js?v=130','assets/pallet3d-v10.js?v=131',1)
          index_path.write_text(index, encoding='utf-8')

          workflow = Path('.github/workflows/fix-dashboard-preview-containment-v115.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Validate JavaScript
        run: node --check assets/pallet3d-v10.js

      - name: Commit contained preview
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Contain dashboard pallet preview"
          git push
