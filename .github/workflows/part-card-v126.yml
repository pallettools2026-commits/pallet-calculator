name: Pallet selected part card v126
on:
  push:
    paths:
      - '.github/workflows/part-card-v126.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve selected part card
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js = Path('assets/pallet3d-v10.js')
          s = js.read_text(encoding='utf-8')

          old = "partInspector.hidden=false;partInspector.querySelector('strong').textContent=`${info.name} №${itemNo}`;partInspector.querySelector('span').textContent=`${fmtMm(info.t)} × ${fmtMm(info.w)} × ${fmtMm(info.l)} мм`;partInspector.querySelector('b').textContent=`${info.n} шт. / поддон · ${total.toLocaleString('ru-RU')} шт. / заказ`;"
          new = "partInspector.hidden=false;partInspector.dataset.kind=info.kind||'';partInspector.querySelector('strong').textContent=`${info.name} №${itemNo}`;partInspector.querySelector('span').textContent=`${fmtMm(info.t)} × ${fmtMm(info.w)} × ${fmtMm(info.l)} мм`;partInspector.querySelector('b').textContent=`На поддон: ${info.n} шт. · На заказ: ${total.toLocaleString('ru-RU')} шт.`;"
          if old not in s:
              raise SystemExit('inspector text target not found')
          s = s.replace(old, new, 1)

          old_hi = "mesh.material.emissive.setHex(0x8a5525);mesh.material.emissiveIntensity=.42;"
          new_hi = "mesh.material.emissive.setHex(0xb66a2d);mesh.material.emissiveIntensity=.50;"
          if old_hi in s:
              s = s.replace(old_hi, new_hi, 1)

          js.write_text(s, encoding='utf-8')

          css = Path('assets/theme-industrial-v130.css')
          c = css.read_text(encoding='utf-8')
          marker = '/* selectedPartCardV1126 */'
          if marker not in c:
              c += r'''

/* selectedPartCardV1126 */
/* Warm production-style selected-part card; no blue selection chrome. */
.previewCard.partPickMode .palletReferenceStage{
  outline:0!important;
  box-shadow:0 10px 28px rgba(82,56,31,.08)!important;
}
.palletPickHint{
  border-color:rgba(151,99,49,.24)!important;
  background:rgba(255,250,242,.96)!important;
  color:#76502f!important;
  box-shadow:0 5px 18px rgba(92,59,28,.09)!important;
}
.palletPickHint.selected{
  border-color:rgba(171,112,54,.34)!important;
  background:rgba(255,246,232,.98)!important;
  color:#6d4322!important;
}
.previewCard.partPickMode .palletPickHint{
  border-color:rgba(151,99,49,.28)!important;
  background:rgba(255,249,239,.97)!important;
  color:#714923!important;
  box-shadow:0 6px 20px rgba(92,59,28,.11)!important;
}
.palletPartInspector{
  left:auto!important;
  right:14px!important;
  bottom:14px!important;
  min-width:245px!important;
  max-width:min(330px,calc(100% - 28px))!important;
  gap:7px!important;
  padding:13px 14px 12px 16px!important;
  border:1px solid rgba(168,108,51,.28)!important;
  border-left:4px solid #b8793d!important;
  border-radius:14px!important;
  background:rgba(255,252,247,.97)!important;
  color:#33291f!important;
  box-shadow:0 12px 30px rgba(61,42,25,.16)!important;
  backdrop-filter:blur(10px)!important;
}
.palletPartInspector::before{
  content:'ВЫБРАННАЯ ДЕТАЛЬ';
  display:block;
  margin-bottom:-2px;
  color:#a46631;
  font-size:9px;
  line-height:1;
  font-weight:900;
  letter-spacing:.11em;
}
.palletPartInspector strong{
  display:block!important;
  color:#2f2a25!important;
  font-size:15px!important;
  line-height:1.15!important;
  letter-spacing:-.1px!important;
}
.palletPartInspector span{
  display:inline-flex!important;
  width:max-content!important;
  max-width:100%!important;
  padding:5px 8px!important;
  border:1px solid rgba(184,121,61,.22)!important;
  border-radius:8px!important;
  background:#f7eadb!important;
  color:#744b28!important;
  font-size:11px!important;
  font-weight:850!important;
  line-height:1.2!important;
}
.palletPartInspector b{
  display:block!important;
  padding-top:7px!important;
  border-top:1px solid rgba(83,64,47,.11)!important;
  color:#66605a!important;
  font-size:10px!important;
  line-height:1.35!important;
  font-weight:800!important;
}
.palletPartInspector[data-kind="block"]{border-left-color:#9b6b3f!important}
.palletPartInspector[data-kind="runner"]{border-left-color:#a66a32!important}
.palletPartInspector[data-kind="cross"]{border-left-color:#c18448!important}
.palletPartInspector[data-kind="deck"]{border-left-color:#d19b64!important}
html[data-theme="dark"] .palletPartInspector{
  background:rgba(35,31,27,.97)!important;
  color:#f3e7d9!important;
  border-color:rgba(205,151,96,.30)!important;
  border-left-color:#c58a4e!important;
}
html[data-theme="dark"] .palletPartInspector strong{color:#fff4e8!important}
html[data-theme="dark"] .palletPartInspector span{background:#3b2f25!important;color:#efc99e!important;border-color:#5c4634!important}
html[data-theme="dark"] .palletPartInspector b{color:#c7c0b9!important;border-top-color:rgba(255,255,255,.10)!important}
html[data-theme="dark"] .palletPickHint,
html[data-theme="dark"] .previewCard.partPickMode .palletPickHint{
  background:rgba(48,39,31,.96)!important;
  border-color:#654d39!important;
  color:#efc99e!important;
}
@media(max-width:620px){
  .palletPartInspector{
    left:9px!important;
    right:9px!important;
    bottom:9px!important;
    min-width:0!important;
    max-width:none!important;
    padding:11px 12px 10px 14px!important;
  }
  .palletPartInspector strong{font-size:14px!important}
}
'''
              css.write_text(c, encoding='utf-8')

          idx = Path('index.html')
          h = idx.read_text(encoding='utf-8')
          h = re.sub(r'assets/theme-industrial-v130\.css\?v=\d+', 'assets/theme-industrial-v130.css?v=176', h)
          h = re.sub(r'assets/pallet3d-v10\.js\?v=\d+', 'assets/pallet3d-v10.js?v=126', h)
          idx.write_text(h, encoding='utf-8')
          PY
      - name: Commit selected part card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pallet3d-v10.js assets/theme-industrial-v130.css index.html
          git commit -m "Improve selected pallet part card" || exit 0
          git push
