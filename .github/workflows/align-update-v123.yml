name: Align v1.0.23 update number

on:
  push:
    paths:
      - '.github/workflows/align-update-v123.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align version labels and cache keys
        run: |
          sed -i 's/обновление №315/обновление №318/g' assets/theme-industrial-v130.css assets/pallet3d-v10.js
          sed -i 's/theme-industrial-v130.css?v=143/theme-industrial-v130.css?v=144/' index.html
          sed -i 's/pallet3d-v10.js?v=139/pallet3d-v10.js?v=140/' index.html
      - name: Remove one-shot workflow
        run: rm .github/workflows/align-update-v123.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/theme-industrial-v130.css assets/pallet3d-v10.js .github/workflows/align-update-v123.yml
          git commit -m 'Align v1.0.23 deployment label'
          git push
