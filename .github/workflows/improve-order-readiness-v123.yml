name: Apply order readiness v1.0.23

on:
  push:
    paths:
      - '.github/workflows/improve-order-readiness-v123.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/apply-order-readiness-v123.py
      - name: Remove temporary files
        run: rm .github/workflows/improve-order-readiness-v123.yml .github/scripts/apply-order-readiness-v123.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/theme-industrial-v130.css assets/pallet3d-v10.js .github/workflows/improve-order-readiness-v123.yml .github/scripts/apply-order-readiness-v123.py
          git commit -m 'Add order readiness assistant'
          git push
