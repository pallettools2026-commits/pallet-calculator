name: Apply Pallet 3D photo reference
on:
  push:
    paths:
      - '.github/workflows/bump-pallet3d-v101.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply active 3D reference patch
        run: python .github/scripts/bump_pallet3d_v101.py
      - name: Commit 3D reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pallet3d-v10.js index.html
          git commit -m "Match 1250x1180 3D to workshop photos" || exit 0
          git push
