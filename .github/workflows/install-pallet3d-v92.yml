name: Install pallet 3D v92
on:
  push:
    paths:
      - '.github/workflows/install-pallet3d-v92.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index and 3D module
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          js=Path('assets/pallet3d-v9.js')
          j=js.read_text(encoding='utf-8')
          j=j.replace("roughness:isEnd?.86:.74","roughness:isEnd ? .86 : .74")
          j=j.replace("opacity:(selected==='all'||selected===kind)?.16:.035","opacity:(selected==='all'||selected===kind) ? .16 : .035")
          js.write_text(j,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'assets/pallet3d-v9.js' not in s:
              pattern=r'<script>\s*/\* pallet3dWebGLV8 \*/.*?</script>'
              s2,n=re.subn(pattern,'<script src="assets/pallet3d-v9.js?v=92"></script>',s,count=1,flags=re.S)
              print('3D script replacements:',n)
              s=s2
          css='<link rel="stylesheet" href="assets/pallet3d-v9.css?v=92">'
          if 'assets/pallet3d-v9.css' not in s:
              s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          print('asset js linked:', 'assets/pallet3d-v9.js' in s)
          print('asset css linked:', 'assets/pallet3d-v9.css' in s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/pallet3d-v9.js
          git commit -m "Install rebuilt pallet 3D v92" || exit 0
          git push
