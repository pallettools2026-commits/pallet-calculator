name: Add production dashboard v3

on:
  push:
    paths:
      - '.github/workflows/add-production-dashboard-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply production dashboard redesign
        run: python .github/scripts/add_production_dashboard_v3.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add production dashboard v3"
          git push
