name: Remove 3D curtain v125
on:
  push:
    paths:
      - '.github/workflows/remove-3d-curtain-v125.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unsupported 3D curtain
        run: python .github/scripts/remove_3d_curtain_v125.py
      - name: Commit 3D curtain removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pallet3d-v10.js index.html
          git commit -m "Hide unsupported 3D preview without curtain" || exit 0
          git push
